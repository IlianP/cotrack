<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>cotrack</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f766e'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11.5' stroke='white' stroke-width='3.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<script>
// Appearance (☰ → Darstellung) is applied before the first paint: "light" | "dark", nothing = follow the system.
try { const t = localStorage.getItem("cotrack.theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch {}
</script>
<style>
:root {
  --bg: #f6f6f3; --surface: #ffffff; --surface-2: #f0f0ec; --text: #1d1d1b; --muted: #6a6a64;
  --line: #e2e2dc; --accent: #0f766e; --accent-ink: #ffffff; --danger: #b91c1c;
  --radius: 12px; --shadow: 0 1px 2px rgb(0 0 0 / .05), 0 2px 8px rgb(0 0 0 / .04);
  --ref-white: 0%; color-scheme: light;
  --lift: 0 2px 6px rgb(0 0 0 / .10), 0 6px 18px rgb(0 0 0 / .10); --lift-lg: 0 10px 32px rgb(0 0 0 / .18);
}
/* Dark: chosen explicitly, or by the system unless light was chosen. Keep both blocks identical. */
:root[data-theme="dark"] {
  --bg: #131312; --surface: #1c1c1a; --surface-2: #252522; --text: #ededE8; --muted: #9b9b94;
  --line: #30302c; --accent: #2dd4bf; --accent-ink: #062b27; --danger: #f87171;
  --shadow: none; --ref-white: 40%; color-scheme: dark;
  --lift: 0 2px 10px rgb(0 0 0 / .55); --lift-lg: 0 10px 32px rgb(0 0 0 / .6);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131312; --surface: #1c1c1a; --surface-2: #252522; --text: #ededE8; --muted: #9b9b94;
    --line: #30302c; --accent: #2dd4bf; --accent-ink: #062b27; --danger: #f87171;
    --shadow: none; --ref-white: 40%; color-scheme: dark;
    --lift: 0 2px 10px rgb(0 0 0 / .55); --lift-lg: 0 10px 32px rgb(0 0 0 / .6);
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  padding-bottom: calc(150px + env(safe-area-inset-bottom)); /* room for the footer line and the floating "+" */
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* top bar */
.top {
  position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 10px;
  padding: 10px 16px; padding-top: calc(10px + env(safe-area-inset-top));
  background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
}
.brand { font-weight: 700; letter-spacing: -.02em; font-size: 18px; white-space: nowrap; }
.brand b { color: var(--accent); }
/* project picker: a button that opens a searchable list (name, code, repository, slug) */
.psel { position: relative; min-width: 0; flex: 1 1 auto; max-width: 340px; }
.psel-btn {
  width: 100%; display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--surface); text-align: left;
}
.psel-btn > span:first-child { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.psel-caret { color: var(--muted); font-size: 11px; flex: none; }
.psel-pop {
  position: absolute; left: 0; top: calc(100% + 6px); z-index: 20; width: min(420px, calc(100vw - 32px));
  display: grid; gap: 6px; padding: 8px; background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius); box-shadow: 0 8px 28px rgb(0 0 0 / .16);
}
.psel-pop[hidden] { display: none; }
.psel-pop input { width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); }
.psel-list { list-style: none; margin: 0; padding: 0; max-height: min(60vh, 420px); overflow-y: auto; overscroll-behavior: contain; }
.psel-list li[role="option"] {
  display: grid; grid-template-columns: 3.4em minmax(0, 1fr) auto; gap: 0 8px; align-items: baseline;
  padding: 7px 8px; border-radius: 8px; cursor: pointer;
}
.psel-list li[aria-selected="true"] { background: var(--surface-2); }
.psel-list li.cur .psel-name { color: var(--accent); font-weight: 600; }
.psel-code { font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); }
.psel-name, .psel-repo { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.psel-count { font-size: 12px; color: var(--muted); }
.psel-repo { grid-column: 2 / -1; font-size: 12px; color: var(--muted); }
.psel-empty { padding: 10px 8px; color: var(--muted); font-size: 13px; }
/* narrow screens: the list spans the whole top bar (its containing block) instead of starting at the button */
@media (max-width: 560px) {
  .psel { position: static; }
  .psel-pop { left: 16px; right: 16px; width: auto; top: calc(100% + 4px); }
}
.live { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; transition: background .3s; }
.live.on { background: #16a34a; box-shadow: 0 0 0 3px color-mix(in srgb, #16a34a 25%, transparent); }
.live.off { background: var(--danger); }
.icon-btn {
  border: 1px solid var(--line); background: var(--surface); border-radius: 10px;
  min-width: 38px; height: 38px; padding: 0 10px; flex: none;
}
.spacer { flex: 1; }

main { max-width: 1400px; margin: 0 auto; padding: 14px 16px; }

/* quick add: a sheet above the floating "+" at the bottom right (thumb reach). --dock = height of the footer line,
   or of the on-screen keyboard while it covers the page (updateMetrics). */
.add {
  display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
}
.add[hidden] { display: none; }
.sheet {
  position: fixed; z-index: 7; margin: 0; right: calc(14px + env(safe-area-inset-right));
  bottom: calc(max(var(--dock, 0px), env(safe-area-inset-bottom)) + 76px); width: min(540px, calc(100vw - 28px));
  box-shadow: var(--lift-lg); animation: rise .16s ease-out;
}
@keyframes rise { from { opacity: 0; transform: translateY(8px); } }
.fab {
  position: fixed; z-index: 7; right: calc(14px + env(safe-area-inset-right));
  bottom: calc(max(var(--dock, 0px), env(safe-area-inset-bottom)) + 12px);
  width: 52px; height: 52px; padding: 0; border-radius: 50%; display: grid; place-items: center;
  border: 1px solid var(--line); background: var(--surface); color: var(--accent); box-shadow: var(--lift);
}
.fab[hidden] { display: none; }
/* while the keyboard is open for something else (e.g. search), the "+" would float above it and cover results */
.kb .fab[aria-expanded="false"] { display: none; }
.fab svg { width: 26px; height: 26px; transition: transform .15s; }
.fab[aria-expanded="true"] svg { transform: rotate(45deg); }
.seg { display: flex; gap: 4px; flex: none; }
.seg button {
  border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px;
  min-width: 38px; height: 38px; font-weight: 700;
}
.seg button[aria-pressed="true"] { background: var(--kc, var(--accent)); color: #fff; border-color: transparent; }
.add input { flex: 1 1 180px; min-width: 0; height: 38px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); }
.primary { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 8px; height: 38px; padding: 0 16px; font-weight: 600; }
.hint { width: 100%; margin: 0; color: var(--muted); font-size: 12.5px; }
.sheet .hint { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

/* filter bar: view + search, then the category and Du/KI toggles. It sticks below the top bar (--top-h); from 1180px
   it moves into the top bar (placeBar), on phones only the toggles stick and the view row scrolls away. */
.bar {
  position: sticky; top: var(--top-h, 59px); z-index: 4; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px;
  margin: -14px -16px 12px; padding: 10px 16px;
  background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px);
}
.bar.stuck, .bar-filter.stuck { box-shadow: 0 1px 0 var(--line); }
.bar-view, .bar-filter, .tgs { display: flex; align-items: center; gap: 8px; min-width: 0; }
.bar-view { flex: 0 1 auto; }
.bar-filter { gap: 14px; }
.tgs { gap: 4px; }
.top .bar { position: static; flex: 0 1 auto; flex-wrap: nowrap; margin: 0; padding: 0; background: none; backdrop-filter: none; }
.top.with-bar .psel { min-width: 170px; }
.chips { display: flex; gap: 4px; background: var(--surface-2); padding: 3px; border-radius: 10px; flex: none; }
.chips button { border: 0; background: transparent; padding: 5px 12px; border-radius: 8px; color: var(--muted); }
.chips button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow); font-weight: 600; }
/* toggle: tap = only this, tap again = all */
.tg {
  display: inline-flex; align-items: center; justify-content: center; gap: 5px; height: 34px; padding: 0 9px; flex: none;
  border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--muted);
  font-size: 13.5px; font-variant-numeric: tabular-nums; white-space: nowrap;
}
.tg .kbadge { min-width: 20px; height: 20px; font-size: 12px; border-radius: 6px; }
.tg[aria-pressed="true"] {
  color: var(--text); font-weight: 650; border-color: var(--kc, var(--accent));
  background: color-mix(in srgb, var(--kc, var(--accent)) 14%, var(--surface));
}
.tg.dim { opacity: .45; }
/* search: a magnifier that opens a narrow field with the cursor already in it */
.search { display: flex; align-items: center; height: 34px; flex: none; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.search:focus-within { border-color: var(--accent); }
.search .ic { width: 32px; height: 32px; padding: 0; border: 0; background: none; color: var(--muted); display: grid; place-items: center; flex: none; }
.search .ic svg { width: 18px; height: 18px; }
.search input {
  display: none; flex: 1 1 auto; min-width: 0; height: 32px; padding: 0 2px; border: 0; background: none; outline: none;
  -webkit-appearance: none; appearance: none;
}
.search input::-webkit-search-cancel-button { display: none; }
.search .x { display: none; }
.search.open { flex: 0 1 240px; min-width: 130px; }
.search.open input { display: block; }
.search.open .x { display: grid; }
@media (max-width: 699px) {
  .bar { display: contents; }
  .bar-view { margin: 0 0 8px; }
  .bar-view .search.open { flex: 1 1 auto; }
  .bar-filter {
    position: sticky; top: var(--top-h, 59px); z-index: 4; margin: 0 -16px 10px; padding: 6px 16px;
    overflow-x: auto; scrollbar-width: none; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px);
  }
  .bar-filter::-webkit-scrollbar { display: none; }
  #kindChips { flex: 1 0 auto; }
  #kindChips .tg { flex: 1 0 auto; }
}
#ownerChips .tg { min-width: 38px; font-size: 16px; }
@media (max-width: 420px) {
  .bar-filter { gap: 10px; }
  .tg { padding: 0 7px; gap: 4px; }
}
/* the toggles do not fit in one row (narrow phone, many categories): the counts go first, the column heads show them */
#filterBar.tight #kindChips .n { display: none; }

/* board */
.board { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); align-items: start; }
/* a single category (filter): one readable column instead of a narrow first cell */
.board.solo { grid-template-columns: minmax(0, 760px); }
.col { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
.col-head { display: flex; align-items: center; gap: 10px; padding: 11px 14px; border-bottom: 1px solid var(--line); }
.col-head h2 { margin: 0; font-size: 14.5px; font-weight: 650; flex: 1; }
.col-head .count { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 13px; }
.kbadge {
  display: inline-grid; place-items: center; min-width: 24px; height: 24px; padding: 0 5px; border-radius: 7px;
  background: var(--kc); color: #fff; font-weight: 700; font-size: 13px;
}
.items { list-style: none; margin: 0; padding: 4px 0; }
.empty { color: var(--muted); padding: 14px; margin: 0; font-size: 14px; }
.item { display: flex; gap: 10px; padding: 9px 12px; align-items: flex-start; border-radius: 8px; margin: 0 4px; }
.item:hover { background: var(--surface-2); }
.item.flash { animation: flash 1.2s ease-out; }
@keyframes flash { from { background: color-mix(in srgb, var(--kc) 22%, transparent); } }
.check {
  flex: none; width: 22px; height: 22px; margin-top: 1px; border-radius: 50%;
  border: 2px solid color-mix(in srgb, var(--kc) 70%, var(--line)); background: transparent; padding: 0;
  display: grid; place-items: center; color: #fff; font-size: 12px; line-height: 1;
}
.check:hover { background: color-mix(in srgb, var(--kc) 18%, transparent); }
.is-done .check { background: var(--kc); border-color: var(--kc); }
.item .main { flex: 1; min-width: 0; cursor: pointer; }
.l1 { display: flex; gap: 7px; align-items: baseline; }
.ref {
  flex: none; border: 0; background: color-mix(in srgb, var(--kc) 14%, transparent); color: var(--kc);
  font-weight: 700; font-size: 12.5px; padding: 1px 6px; border-radius: 6px; font-variant-numeric: tabular-nums;
}
.ref { color: color-mix(in srgb, var(--kc), white var(--ref-white)); }
.title { overflow-wrap: anywhere; }
.is-done .title { color: var(--muted); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--muted) 60%, transparent); }
.desc { margin: 3px 0 0; color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.meta { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 5px; }
.pill { font-size: 12px; padding: 1px 7px; border-radius: 99px; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pill.wait { color: #b45309; border-color: color-mix(in srgb, #d97706 40%, var(--line)); }
.pill.next { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }
.pill.st-doing { color: var(--accent); }
.pill.st-blocked { color: var(--danger); }
.pill a { color: inherit; }

/* footer line */
.footline {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; display: flex; gap: 10px; align-items: center;
  padding: 10px 16px; padding-bottom: calc(10px + env(safe-area-inset-bottom));
  background: var(--surface); border-top: 1px solid var(--line);
}
.footline[hidden] { display: none; }
.footline code {
  flex: 1; min-width: 0; font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted);
  overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
}

/* dialogs */
dialog {
  border: 1px solid var(--line); border-radius: 16px; background: var(--surface); color: var(--text);
  padding: 0; width: min(560px, calc(100vw - 24px)); max-height: calc(100dvh - 24px);
}
dialog::backdrop { background: rgb(0 0 0 / .4); }
dialog:focus { outline: none; }
dialog.ask { width: min(470px, calc(100vw - 24px)); }
.dlg { padding: 18px; display: grid; gap: 12px; }
.dlg h3 { margin: 0; font-size: 17px; display: flex; gap: 8px; align-items: center; }
.dlg label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
.dlg input, .dlg select, .dlg textarea {
  width: 100%; padding: 9px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font-size: 15px;
}
.dlg textarea { min-height: 90px; resize: vertical; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
.btn { border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; height: 38px; padding: 0 14px; }
.btn.danger { color: var(--danger); }
.small { font-size: 12.5px; color: var(--muted); margin: 0; }
.menu-list { display: grid; gap: 6px; }
.menu-list button { text-align: left; }
/* menu: sections by scope (this device · projects · chat footer · access) */
.dlg h4.sec {
  margin: 2px 0 -4px; padding-top: 12px; border-top: 1px solid var(--line);
  font-size: 12.5px; font-weight: 650; color: var(--muted);
}
.dlg h3 + h4.sec { border-top: 0; padding-top: 0; }
.menu-row { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; }
/* labels may wrap (long project texts, other languages): the button grows instead of overflowing */
.menu-list .btn, .menu-row .btn { height: auto; min-height: 38px; padding: 8px 14px; line-height: 1.3; }
.menu-row .btn { display: flex; align-items: center; justify-content: center; text-decoration: none; color: inherit; }
.menu-row .btn.danger { color: var(--danger); }
.close-x { margin: -6px -8px -6px auto; width: 36px; height: 36px; padding: 0; border: 0; border-radius: 8px; background: none; color: var(--muted); font-size: 24px; line-height: 1; }
.close-x:hover { background: var(--surface-2); }
.theme-row { display: flex; align-items: center; gap: 8px; }
.theme-row .seg button { min-width: 44px; font-size: 18px; }
.theme-row .seg.txt button { min-width: 48px; font-size: 13px; }
.dlg h4 { margin: 4px 0 0; font-size: 14px; }
.preview {
  margin: 0; padding: 10px 12px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--line);
  font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; overflow-wrap: anywhere;
}

/* views without the board: the filter bar's toggles and the search apply to the board only */
#board[hidden], .next[hidden], .deps[hidden], #bar[hidden], #filterBar[hidden], #searchBox[hidden] { display: none; }

/* top bar: the three views as icons (A55); on phones the logo mark stands in for the word "cotrack" */
.brand { display: flex; align-items: center; }
.brand-mark { display: none; width: 28px; height: 28px; flex: none; }
.brand-mark rect { fill: var(--accent); }
.brand-mark path { fill: none; stroke: var(--accent-ink); stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
.modes { display: flex; gap: 2px; padding: 3px; border-radius: 10px; background: var(--surface-2); flex: none; }
.modes button {
  width: 36px; height: 32px; padding: 0; border: 0; border-radius: 8px; background: none; color: var(--muted);
  display: grid; place-items: center;
}
.modes button:hover { color: var(--text); }
.modes button[aria-pressed="true"] { background: var(--surface); color: var(--accent); box-shadow: var(--shadow); }
.modes svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
@media (max-width: 560px) {
  .top { gap: 6px; padding-left: 10px; padding-right: 10px; }
  .top > .spacer { display: none; }
  .top .icon-btn { min-width: 36px; padding: 0 8px; }
  .psel-btn { padding: 7px 8px; gap: 4px; }
  .brand-mark { display: block; }
  .modes button { width: 31px; }
}
/* very narrow phones (iPhone SE): the project name needs the room more than the caret and the live dot */
@media (max-width: 374px) { .psel-caret, .top .live { display: none; } }

/* Ketten: what waits for what (A55). Columns left to right = order; on phones the chain runs top to bottom (.vert). */
.deps { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr) 300px; align-items: start; }
.deps.no-side { grid-template-columns: minmax(0, 1fr); }
@media (max-width: 999px) { .deps { grid-template-columns: minmax(0, 1fr); } .dg-side { order: -1; } }
@media (min-width: 1180px) { .dg-side { position: sticky; top: calc(var(--top-h, 59px) + 14px); } }
.dg-main { display: grid; gap: 14px; min-width: 0; }
.dg-head, .dg-legend { margin: 0; color: var(--muted); font-size: 14px; }
.dg-legend { font-size: 12.5px; }
.dg-proj { margin: 8px 0 -4px; font-size: 14px; font-weight: 650; }
.dg-chain {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow);
  overflow-x: auto; overscroll-behavior-x: contain;
}
.dg-graph {
  position: relative; display: grid; grid-auto-flow: column; grid-auto-columns: max-content; gap: 0 56px;
  padding: 34px 20px 36px; width: max-content; min-width: 100%;
}
.dg-col { display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 12px; }
.dg-edges { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; }
.dg-edges path { fill: none; stroke: var(--muted); stroke-width: 1.8; stroke-linecap: round; }
.dg-edges path.head { fill: var(--muted); stroke: none; }
.dg-edges path.done { stroke-dasharray: 5 5; opacity: .6; }
.dg-edges path.head.done { opacity: .6; }
.dg-edges path.cycle { stroke: var(--danger); }
.dg-edges path.head.cycle { fill: var(--danger); }
.dg-graph.vert { grid-auto-flow: row; grid-auto-columns: auto; grid-template-columns: minmax(0, 1fr); gap: 34px 0; padding: 14px 34px 14px 32px; width: auto; }
.vert .dg-col { flex-direction: row; flex-wrap: wrap; justify-content: center; gap: 8px; }
.dg-node {
  position: relative; display: flex; gap: 10px; align-items: flex-start; width: 232px; padding: 10px 12px; text-align: left;
  border: 1px solid var(--line); border-radius: 12px; background: var(--surface); box-shadow: var(--shadow); color: var(--text);
}
.vert .dg-node { width: auto; flex: 1 1 150px; max-width: 100%; }
.vert .dg-node .kbadge { display: none; } /* narrow cards: the coloured reference says the category */
.dg-node:hover { border-color: color-mix(in srgb, var(--kc) 55%, var(--line)); }
.dg-node .kbadge { flex: none; min-width: 26px; height: 26px; }
.dg-node .tx { min-width: 0; display: grid; gap: 2px; }
.dg-t { font-size: 14px; line-height: 1.35; overflow-wrap: break-word; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.dg-t b { color: color-mix(in srgb, var(--kc), white var(--ref-white)); font-variant-numeric: tabular-nums; }
.dg-sub { font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
.dg-node.is-done { background: var(--surface-2); border-style: dashed; box-shadow: none; color: var(--muted); }
.dg-node.is-done .kbadge { background: color-mix(in srgb, var(--muted) 30%, var(--surface-2)); color: var(--text); }
.dg-node.is-done .dg-t span { text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--muted) 60%, transparent); }
.dg-node.is-free { border: 2px solid var(--accent); padding: 9px 11px; box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 14%, transparent); }
.dg-node.is-free .dg-sub { color: var(--accent); font-weight: 600; }
.dg-node.is-cycle { border: 2px solid var(--danger); padding: 9px 11px; }
.dg-node.is-cycle .dg-sub { color: var(--danger); font-weight: 600; }
.dg-node.is-missing { background: transparent; box-shadow: none; border: 1.5px dashed color-mix(in srgb, var(--danger) 55%, var(--line)); }
.dg-pill {
  display: inline-flex; align-items: center; gap: 4px; padding: 4px 11px; border-radius: 99px; font-size: 13px; white-space: nowrap;
  border: 1px dashed color-mix(in srgb, var(--muted) 50%, var(--line)); background: var(--surface-2); color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.dg-pill:hover { color: var(--text); }
.dg-pill.hid { border-style: solid; font-weight: 600; letter-spacing: .02em; }
.dg-node.flash, .dg-pill.flash { animation: flash 1.2s ease-out; }
.dg-node.ping, .dg-pill.ping { animation: ping 1.8s ease-out; }
@keyframes ping { 0%, 35% { box-shadow: 0 0 0 6px color-mix(in srgb, var(--accent) 45%, transparent); } }
.dg-empty { padding: 26px 20px; text-align: center; }
.dg-empty h2 { margin: 0 0 6px; font-size: 18px; }
.dg-empty p { margin: 0; color: var(--muted); font-size: 14px; }
/* "Auffällig": what stands out – a panel on the right, above the chains (and closable) on smaller screens */
.dg-side { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); min-width: 0; }
.dg-side summary { display: flex; align-items: center; gap: 8px; padding: 12px 16px; font-weight: 650; cursor: pointer; list-style: none; }
.dg-side summary::-webkit-details-marker { display: none; }
.dg-side summary::after { content: "▾"; margin-left: auto; color: var(--muted); font-size: 12px; transition: transform .15s; }
.dg-side:not([open]) summary::after { transform: rotate(-90deg); }
.dg-side summary .count { color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; }
.dg-side[open] summary { padding-bottom: 2px; }
.dg-note { padding: 0 12px 10px; }
.dg-note h3 { margin: 8px 4px 2px; font-size: 13.5px; }
.dg-note h3.bad { color: var(--danger); }
.dg-note ul { list-style: none; margin: 0; padding: 0; }
.dg-note button {
  width: 100%; display: flex; gap: 8px; align-items: baseline; padding: 6px 4px; border: 0; border-radius: 8px;
  background: none; text-align: left; color: var(--text);
}
.dg-note button:hover { background: var(--surface-2); }
.dg-note .t { min-width: 0; overflow-wrap: anywhere; }
.dg-note .why { display: block; font-size: 12.5px; color: var(--muted); }

/* Next: one item at a time, the rest in order beside it (A53) */
.next { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr) 300px; align-items: start; max-width: 1080px; }
@media (max-width: 860px) { .next { grid-template-columns: minmax(0, 1fr); } }
.nx-head { grid-column: 1 / -1; margin: 0; color: var(--muted); font-size: 14px; }
.nx-card {
  background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow);
  padding: 20px; display: grid; gap: 12px; min-width: 0;
}
.nx-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.nx-kind { color: var(--muted); font-size: 14px; }
.nx-title { margin: 0; font-size: 22px; line-height: 1.25; letter-spacing: -.01em; overflow-wrap: anywhere; }
.nx-why { margin: 0; color: var(--accent); font-size: 14px; font-weight: 600; }
.nx-body {
  margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14.5px; max-height: 45vh; overflow-y: auto;
  padding: 10px 12px; background: var(--surface-2); border-radius: 10px;
}
.nx-card label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
.nx-card textarea {
  width: 100%; min-height: 64px; padding: 9px 10px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--bg); color: var(--text); resize: vertical;
}
.nx-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.nx-actions .primary, .nx-actions .btn { height: 42px; }
.nx-actions .primary { padding: 0 20px; }
.nx-side { display: grid; gap: 10px; min-width: 0; }
.nx-side .small { padding: 0 4px; }
.nx-list { list-style: none; margin: 0; padding: 4px; }
.nx-list button {
  width: 100%; display: flex; gap: 8px; align-items: baseline; text-align: left; border: 0; background: none;
  padding: 8px; border-radius: 8px;
}
.nx-list button:hover { background: var(--surface-2); }
.nx-list .t { overflow-wrap: anywhere; }
.nx-list .why { display: block; font-size: 12.5px; color: var(--muted); }
.nx-empty { text-align: center; padding: 32px 20px; }
.nx-empty h2 { margin: 0 0 6px; font-size: 20px; }

/* Verlauf: who changed what, as a panel on the right; full width on phones (A54) */
.hist-btn { position: relative; display: grid; place-items: center; color: var(--text); }
.hist-btn svg { width: 19px; height: 19px; }
.hist-btn[aria-expanded="true"] { border-color: var(--accent); color: var(--accent); }
.badge {
  position: absolute; top: -6px; right: -6px; min-width: 19px; height: 19px; padding: 0 5px; border-radius: 10px;
  background: var(--accent); color: var(--accent-ink); font-size: 11px; font-weight: 700; line-height: 19px; text-align: center;
}
.badge[hidden] { display: none; }
.hist {
  position: fixed; z-index: 8; top: var(--top-h, 59px); right: 0; bottom: 0; width: min(400px, 100vw);
  display: flex; flex-direction: column; background: var(--surface); border-left: 1px solid var(--line); box-shadow: var(--lift-lg);
  animation: slide .16s ease-out;
}
@keyframes slide { from { opacity: 0; transform: translateX(16px); } }
.hist[hidden] { display: none; }
.hist-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 8px; padding: 12px 14px 10px; border-bottom: 1px solid var(--line); }
.hist-head h2 { margin: 0; font-size: 16px; }
.hist-head .close-x { margin: -6px -6px -6px 0; }
.hist-head .chips { grid-column: 1 / -1; justify-self: start; }
.hist-list { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 0 10px calc(16px + env(safe-area-inset-bottom)); }
.hist-new {
  margin: 10px 4px 2px; padding: 8px 10px; border-radius: 10px; font-size: 13.5px;
  background: color-mix(in srgb, var(--accent) 12%, var(--surface)); color: var(--text);
}
.hist-day { font-size: 12.5px; font-weight: 650; color: var(--muted); padding: 12px 6px 4px; }
.hev { display: flex; gap: 10px; align-items: flex-start; padding: 8px 6px; border-radius: 8px; }
button.hev { width: 100%; border: 0; background: none; text-align: left; font: inherit; color: inherit; }
.hev .what, .hev .det { display: block; }
.hev.link { cursor: pointer; }
.hev.link:hover { background: var(--surface-2); }
.hev.new { background: color-mix(in srgb, var(--accent) 9%, transparent); }
.hev .who { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); font-size: 14px; }
.hev .txt { flex: 1; min-width: 0; }
.hev .what { overflow-wrap: anywhere; }
.hev .what .ref { margin-right: 6px; }
.hev .det { font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
.hev time { flex: none; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; padding-top: 2px; }
.hist-more { display: block; margin: 12px auto 0; }
@media (max-width: 560px) { .hist { width: 100vw; border-left: 0; } }

#toast {
  position: fixed; left: 50%; bottom: calc(max(var(--dock, 0px), env(safe-area-inset-bottom)) + var(--toast-up, 78px));
  transform: translateX(-50%) translateY(20px);
  background: var(--text); color: var(--bg); padding: 8px 14px; border-radius: 10px; font-size: 14px;
  opacity: 0; pointer-events: none; transition: .2s; z-index: 20; max-width: calc(100vw - 32px);
  display: flex; align-items: center; gap: 10px;
}
#toast.show { opacity: 1; transform: translateX(-50%); }
#toast.show.has-action { pointer-events: auto; }
#toast button { background: none; border: 0; padding: 2px 4px; color: inherit; font: inherit; font-weight: 600; text-decoration: underline; cursor: pointer; }

@media (max-width: 560px) {
  .brand span { display: none; }
  .row2 { grid-template-columns: 1fr; }
  .board { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) {
  .sheet, .hist, .dg-node, .dg-pill { animation: none; }
  .fab svg { transition: none; }
}
</style>
</head>

<script>
"use strict";
const $ = (s) => document.querySelector(s);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} },
};
/* ---------------------------------------------------------- language */
// UI language per device (☰ → Sprache, localStorage "cotrack.lang"): a stored choice wins; otherwise the first German
// or English entry in the browser's language list decides (de, de-DE, de-AT, de-CH … and gsw count as German), and
// anything else gets English. Every UI text lives in STRINGS: add new ones in both languages. Code and API stay English.
const LANGS = ["de", "en"];
const primaryTag = (tag) => String(tag || "").toLowerCase().split(/[-_]/)[0];
function detectLang() {
  for (const tag of navigator.languages?.length ? navigator.languages : [navigator.language]) {
    const p = primaryTag(tag);
    if (p === "de" || p === "gsw") return "de";
    if (p === "en") return "en";
  }
  return "en";
}
const LANG = LANGS.includes(store.get("cotrack.lang")) ? store.get("cotrack.lang") : detectLang();
// Dates follow the reader's own variant of that language (de-AT, en-US …).
const LOCALE = [...(navigator.languages || []), navigator.language].find((l) => primaryTag(l) === LANG) || (LANG === "de" ? "de-DE" : "en-GB");

const STRINGS = {
  de: {
    owners: { user: "Du", ai: "KI" },
    actors: { user: "dir", ai: "der KI" }, // "angelegt … von dir"
    statuses: { open: "offen", doing: "in Arbeit", blocked: "blockiert", done: "erledigt", dropped: "verworfen" },

    search: "Suchen", searchTitle: "Suchen (Taste /)", searchPh: "Suchen …", searchClose: "Suche schließen",
    kindsGroup: "Nach Kategorie filtern", ownersGroup: "Nach Zuständigkeit filtern",
    onlyKind: (name) => `${name} – nur diese Kategorie (nochmal tippen: alle)`,
    onlyUser: "Nur deine Punkte (nochmal tippen: alle)", onlyAi: "Nur Punkte der KI (nochmal tippen: alle)",
    addOpen: "Neuer Punkt", addClose: "Eingabe schließen", category: "Kategorie", responsible: "Verantwortlich",
    addPh: "Neuer Punkt … z. B. „Lizenz wählen“", add: "Hinzufügen", addTip: "Tipp: „I: …“ wählt die Kategorie per Kürzel.",
    footerTitle: "Fußzeile für den Chat", copy: "Kopieren", copied: "Kopiert", copyPrompt: "Zum Kopieren:", footerCopied: "Fußzeile kopiert",
    error: (msg) => "Fehler: " + msg, tokenInvalid: "Token ungültig oder abgelaufen.",
    newProject: (label) => "Neues Projekt: " + label, open: "Öffnen", newProjects: (n, names) => `${n} neue Projekte: ${names}`,
    allProjects: "Alle Projekte", noProject: "Kein Projekt", projectAria: (label) => "Projekt: " + label,
    noProjectYet: "Noch kein Projekt. Lege über ☰ ein neues an.", nothingOpen: "Nichts offen 🎉", noItems: "Keine Einträge",
    footerEmpty: "Nichts offen.", waitingFor: "wartet auf", followedBy: "danach folgt", source: "Quelle",
    reopen: "Wieder öffnen", markDone: "Erledigt", reopenAria: (ref) => `${ref} wieder öffnen`, doneAria: (ref) => `${ref} erledigt`,
    copyRef: "Kennung + Titel kopieren", created: (ref) => `${ref} angelegt`, saved: (ref) => `${ref} gespeichert`,
    deleted: (ref) => `${ref} gelöscht`, openItems: "offene Punkte", noProjectFound: "Kein Projekt gefunden",
    askSave: "Änderungen speichern?", askSaveText: "Du hast in diesem Fenster etwas geändert.", discard: "Verwerfen",
    keepEditing: "Weiter bearbeiten", save: "Speichern", cancel: "Abbrechen", close: "Schließen", del: "Löschen",

const lookup = (dict, key) => key.split(".").reduce((o, k) => (o == null ? o : o[k]), dict);
// tr("saved", "A4") → "A4 gespeichert" / "A4 saved"; a missing English text falls back to German.
function tr(key, ...args) {
  const v = lookup(STRINGS[LANG], key) ?? lookup(STRINGS.de, key);
  return typeof v === "function" ? v(...args) : v ?? key;
}
// Fixed texts in the markup: data-t sets the text, data-t-attr="attr:key;attr:key" attributes.
function applyStaticTexts() {
  document.documentElement.lang = LANG;
  for (const el of document.querySelectorAll("[data-t]")) el.textContent = tr(el.dataset.t);
  for (const el of document.querySelectorAll("[data-t-attr]")) {
    for (const pair of el.dataset.tAttr.split(";")) {
      const [attr, key] = pair.split(":");
      el.setAttribute(attr, tr(key));
    }
  }
}
applyStaticTexts();

/* tiny DOM helper: never uses innerHTML, so user text cannot inject markup */
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "style") el.style.cssText = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat(Infinity)) if (c != null && c !== false) el.append(c instanceof Node ? c : String(c));
  return el;
}

async function api(path, { method = "GET", body } = {}) {
  const res = await fetch("/api" + path, {
    method,
    headers: { authorization: "Bearer " + state.token, ...(body ? { "content-type": "application/json" } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (res.status === 401) { showLogin(tr("tokenInvalid")); throw new Error("unauthorized"); }
  const isJson = (res.headers.get("content-type") || "").includes("json");
  const data = isJson ? await res.json() : await res.text();
  if (!res.ok) throw new Error((data && data.error ? data.error + (data.detail ? ": " + data.detail : "") : res.status));
  return data;
}
const P = (slug) => "/projects/" + encodeURIComponent(slug);

// action: optional { label, onclick } – shown as a button; such toasts stay longer.
function toast(msg, action) {
  const t = $("#toast");
  const hide = () => t.classList.remove("show");
  t.replaceChildren(h("span", null, msg), ...(action ? [h("button", { type: "button", onclick: () => { hide(); action.onclick(); } }, action.label)] : []));
  t.classList.toggle("has-action", !!action);
  t.classList.add("show");
  clearTimeout(toast.t); toast.t = setTimeout(hide, action ? 6000 : 1800);
}
async function copy(text, label = tr("copied")) {
  try { await navigator.clipboard.writeText(text); toast(label); }
  catch { prompt(tr("copyPrompt"), text); }
}

/* ---------------------------------------------------------- loading */
async function boot() {
  if (!state.token) return showLogin();
  try {
    // Global version is read before the project list, so a project created in between is picked up by the next poll.
    const [me, kinds, ver] = await Promise.all([api("/me"), api("/kinds?all=1"), api("/version")]);
    state.globalVersion = ver.version;
    state.actor = me.actor; state.allKinds = kinds.kinds.map(localizeKind); state.kinds = state.allKinds.filter((k) => k.active);
    state.addKind = state.addKind || state.kinds[0]?.code;
    await loadProjects();
    renderKindSeg();
    await refresh(true);
    if (!boot.started) {
      boot.started = true;
      setInterval(poll, 4000);
      document.addEventListener("visibilitychange", poll);
    }
    poll();
  } catch (e) { if (e.message !== "unauthorized") toast(tr("error", e.message)); }
}

// notify: point out projects that appeared since the last load (e.g. created by an AI via MCP).
async function loadProjects(notify) {
  const known = new Set(state.projects.map((p) => p.slug));
  state.projects = (await api("/projects")).projects;
  const added = notify && loadProjects.done ? state.projects.filter((p) => !known.has(p.slug)) : [];
  loadProjects.done = true;
  if (state.project !== ALL && !state.projects.some((p) => p.slug === state.project)) {
    state.project = state.projects[0]?.slug || "";
  }
  renderProjects();
  if (added.length === 1) {
    const p = added[0];
    toast(tr("newProject", `${p.code ? p.code + " · " : ""}${p.name}`), p.slug === state.project ? null : { label: tr("open"), onclick: () => selectProject(p.slug) });
  } else if (added.length > 1) {
    toast(tr("newProjects", added.length, added.map((p) => p.name).join(", ")));
  }
}

async function refresh(force) {

function nextQueue() {

    const blocked = i.status === "blocked" || refList(i.waiting_on).some((r) => openKeys.has(i.project_slug + ":" + r));
    (blocked ? waiting : mine).push(i);

  mine.sort((a, b) => {

    if (freed.length) parts.push(tr("nextFreed", freed.join(", ")));

  const req = ++hist.req;

    : mode === "newer" && hist.events.length ? "&after=" + hist.events[0].id : "";

  // stay reachable via "Ältere laden"), so no gap opens between new and already shown entries.

// What an event says, from its action and the fields it changed (data holds the new values only).
function histDetails(e) {

/* ---------------------------------------------------------- Ketten (A55) */
// What waits for what, from "Wartet auf" (waiting_on). A chain is everything connected by it: items that wait, what they
// wait for (also closed items or unknown references) and what waits behind them. Built here from all items of the view;
// the server is not involved. Only chains with an open item that waits are shown in "Offen" ("Erledigt": chains that are
// all closed, "Alle": every chain). Filters and search never cut a chain: items they hide fold into "⋯ n", and in "Offen"
// closed prerequisites shrink to "✓ A36", so the order stays visible. Columns: prerequisites left, what waits right
// (phones: top to bottom); arrows are an SVG drawn over the cards from their positions.
const deps = { model: null, chains: [], expanded: new Set(), sideOpen: null };
const NARROW = matchMedia("(max-width: 699px)");
const SVGNS = "http://www.w3.org/2000/svg";
const isClosed = (i) => i.status === "done" || i.status === "dropped";
const natural = (a, b) => a.localeCompare(b, undefined, { numeric: true });
const qref = (slug, ref) => (state.project === ALL ? `${state.projects.find((p) => p.slug === slug)?.code || slug}:${ref}` : ref);
const shortDate = (iso) => (iso ? new Date(iso).toLocaleDateString(LOCALE, { day: "numeric", month: "numeric" }) : "–");
const closedText = (it) => tr(it.status === "dropped" ? "depsDroppedOn" : "depsDoneOn", shortDate(it.closed_at || it.updated_at));
function cmpRank(x, y) {
  for (let n = 0; n < x.length; n++) {
    if (x[n] === y[n]) continue;
    return typeof x[n] === "string" ? natural(x[n], y[n]) : x[n] - y[n];
  }
  return 0;
}

// Graph of all items that take part in a dependency: node per reference, edges prerequisite → waiting item.
function depsModel(items) {
  const byKey = new Map(items.map((i) => [itemKey(i), i]));
  const nodes = new Map();
  const node = (slug, ref) => {
    const key = slug + ":" + ref;
    if (!nodes.has(key)) nodes.set(key, { key, slug, ref, item: byKey.get(key) || null, pre: [], post: [] });
    return nodes.get(key);
  };
  for (const i of items) for (const r of refList(i.waiting_on)) {
    const a = node(i.project_slug, r), b = node(i.project_slug, i.ref);
    if (!a.post.includes(b)) { a.post.push(b); b.pre.push(a); }
  }
  const sorted = [...nodes.values()].sort((a, b) => natural(a.key, b.key));
  // Kreise: strongly connected parts (Tarjan) with more than one item, or an item that waits for itself.
  const cycles = [], idx = new Map(), low = new Map(), stack = [], on = new Set();
  const visit = (v) => {
    idx.set(v, idx.size); low.set(v, idx.get(v)); stack.push(v); on.add(v);
    for (const w of v.post) {
      if (!idx.has(w)) { visit(w); low.set(v, Math.min(low.get(v), low.get(w))); }
      else if (on.has(w)) low.set(v, Math.min(low.get(v), idx.get(w)));
    }
    if (low.get(v) !== idx.get(v)) return;
    const part = [];
    let w;
    do { w = stack.pop(); on.delete(w); part.push(w); } while (w !== v);
    if (part.length > 1 || v.post.includes(v)) cycles.push(part);
  };
  for (const v of sorted) if (!idx.has(v)) visit(v);
  for (const part of cycles) { const set = new Set(part); for (const v of part) v.cycle = set; }
  for (const v of nodes.values()) v.open = !!v.item && !isClosed(v.item);
  for (const v of nodes.values()) {
    v.openPost = v.post.filter((w) => w.open);
    v.resolved = v.pre.filter((p) => p.item && isClosed(p.item));
    // frei: everything it waited for is closed (unknown references never count as closed)
    v.free = v.open && v.item.status !== "blocked" && v.pre.length > 0 && v.resolved.length === v.pre.length;
  }
  const comps = [], seen = new Set();
  for (const v of sorted) {
    if (seen.has(v)) continue;
    const list = [], todo = [v];
    seen.add(v);
    while (todo.length) {
      const x = todo.pop(); list.push(x);
      for (const y of [...x.pre, ...x.post]) if (!seen.has(y)) { seen.add(y); todo.push(y); }
    }
    list.sort((a, b) => natural(a.key, b.key));
    comps.push({ key: list[0].key, slug: list[0].slug, nodes: list });
  }
  return { nodes, comps, cycles };
}

// Chains of the current view before filters; returns their items (search applied) for the filter bar.
function depsPrepare() {
  const m = depsModel(state.items);
  const waits = (c) => c.nodes.some((v) => v.open && v.pre.length);
  const anyOpen = (c) => c.nodes.some((v) => v.open);
  m.shown = m.comps.filter((c) => (state.view === "open" ? waits(c) : state.view === "closed" ? !anyOpen(c) : true));
  const q = fold(state.q);
  const hit = (i) => !q || fold([i.ref, i.title, i.short, i.body].join(" ")).includes(q);
  deps.model = m;
  return m.shown.flatMap((c) => c.nodes.filter((v) => v.item && hit(v.item)).map((v) => v.item));
}

function renderDeps(cols, before) {
  const m = deps.model, box = $("#deps");
  const filtered = !!(state.kind || state.owner || state.q);
  // chains unfolded by hand fold again once project, view, filter or search change
  const sig = [state.project, state.view, state.kind, state.owner, state.q].join("|");
  if (deps.sig !== sig) { deps.sig = sig; deps.expanded.clear(); }
  const match = new Set(cols.filter((c) => c.shown).flatMap((c) => c.list.map(itemKey)));
  const compact = state.view === "open";
  const chains = m.shown.filter((c) => !filtered || deps.expanded.has(c.key) || c.nodes.some((v) => match.has(v.key)));
  const rank = (c) => [c.nodes.some((v) => v.cycle) ? 0 : 1, c.nodes.some((v) => !v.item) ? 0 : 1,
    c.nodes.some((v) => v.free) ? 0 : 1, -Math.max(0, ...c.nodes.map((v) => v.openPost.length)), c.key];
  chains.sort((a, b) => cmpRank(rank(a), rank(b)));
  deps.chains = [];
  const notes = depsNotes(m);
  box.classList.toggle("no-side", !notes.length);
  if (!chains.length) {
    const [title, hint] = m.shown.length ? ["depsNoMatch", "depsNoMatchHint"]
      : state.view === "closed" ? ["depsNoneClosed", "depsNoneClosedHint"] : ["depsNone", "depsNoneHint"];
    box.replaceChildren(...[h("div", { class: "dg-main" }, h("section", { class: "col dg-empty" }, h("h2", null, tr(title)), h("p", null, tr(hint)))),
      notes.length ? depsSide(notes) : null].filter(Boolean));
    return;
  }
  // "Alle Projekte": one block per project, in the order of the project list
  const order = new Map(state.projects.map((p, i) => [p.slug, i]));
  const slugs = [...new Set(chains.map((c) => c.slug))].sort((a, b) => (order.get(a) ?? 1e9) - (order.get(b) ?? 1e9));
  const main = [h("p", { class: "dg-head" }, tr("depsHead", chains.length, state.project === ALL ? tr("allProjects") : currentProject()?.name || ""))];
  for (const slug of slugs) {
    if (state.project === ALL) {
      const p = state.projects.find((x) => x.slug === slug);
      main.push(h("h2", { class: "dg-proj" }, p ? `${p.code ? p.code + " · " : ""}${p.name}` : slug));
    }
    for (const c of chains) if (c.slug === slug) main.push(depsChain(c, filtered, match, compact, before));
  }
  main.push(h("p", { class: "dg-legend" }, tr("depsLegend")));
  box.replaceChildren(...[h("div", { class: "dg-main" }, main), notes.length ? depsSide(notes) : null].filter(Boolean));
  drawDeps();

// One chain: hidden items fold into "⋯ n" (connected ones together), then columns by the longest way from the start.
function depsChain(c, filtered, match, compact, before) {
  const all = deps.expanded.has(c.key);
  const shows = (v) => !v.item || all || !filtered || match.has(v.key) || (compact && isClosed(v.item));
  // Hidden items that wait for each other join one "⋯ n" – but only while the order survives: a group must never hold
  // something before and something after another card (A1 → A2 → A3 with only A2 shown would look like a cycle).
  // Test: no way leads out of the group and back into it.
  const hiddenNodes = c.nodes.filter((v) => !shows(v));
  const groupOf = new Map(hiddenNodes.map((v) => [v, [v]]));
  const closedOff = (set) => {
    const todo = [], seen = new Set();
    for (const v of set) for (const w of v.post) if (!set.has(w)) todo.push(w);
    while (todo.length) {
      const w = todo.pop();
      if (set.has(w)) return false;
      if (!seen.has(w)) { seen.add(w); todo.push(...w.post); }
    }
    return true;
  };
  for (const v of hiddenNodes) for (const w of v.post) {
    const a = groupOf.get(v), b = groupOf.get(w);
    if (!b || a === b) continue;
    const merged = [...a, ...b];
    if (closedOff(new Set(merged))) for (const x of merged) groupOf.set(x, merged);
  }
  const rep = new Map(), groups = new Map();
  for (const v of c.nodes) {
    if (shows(v)) { rep.set(v, { key: v.key, v, pre: new Set(), post: new Set() }); continue; }
    const g = groupOf.get(v);
    if (!groups.has(g)) {
      const hidden = g.slice().sort((x, y) => natural(x.key, y.key));
      groups.set(g, { key: "hid:" + hidden[0].key, hidden, pre: new Set(), post: new Set() });
    }
    rep.set(v, groups.get(g));
  }
  const edges = new Map();
  for (const v of c.nodes) for (const w of v.post) {
    const a = rep.get(v), b = rep.get(w);
    if (a === b && v !== w) continue; // inside one "⋯"
    const key = a.key + ">" + b.key, cycle = !!v.cycle?.has(w), done = !!v.item && isClosed(v.item);
    const e = edges.get(key);
    if (e) { e.cycle ||= cycle; e.done &&= done; } else edges.set(key, { a, b, cycle, done });
    a.post.add(b); b.pre.add(a);
  }
  // Columns: a depth-first walk from the starting points marks the edges that close a cycle; without them the
  // chain has an order, and each card stands one column right of the latest thing it waits for.
  const vnodes = [...new Set(rep.values())];
  const walk = new Map(), back = new Set();
  const dfs = (x) => {
    walk.set(x, 1);
    for (const y of [...x.post].sort((p, q) => natural(p.key, q.key))) {
      if (walk.get(y) === 1) back.add(x.key + ">" + y.key);
      else if (!walk.has(y)) dfs(y);
    }
    walk.set(x, 2);
  };
  for (const x of vnodes.slice().sort((p, q) => (p.pre.size ? 1 : 0) - (q.pre.size ? 1 : 0) || natural(p.key, q.key))) if (!walk.has(x)) dfs(x);
  const level = new Map();
  const lv = (x) => {
    if (level.has(x)) return level.get(x);
    level.set(x, 0);
    let l = 0;
    for (const p of x.pre) if (!back.has(p.key + ">" + x.key)) l = Math.max(l, lv(p) + 1);
    level.set(x, l);
    return l;
  };
  vnodes.forEach(lv);
  const cols = [];
  for (const x of vnodes) (cols[level.get(x)] ||= []).push(x);
  // within a column: near what it waits for (fewer crossing arrows); the first column: what holds up most on top
  const pos = new Map();
  cols.forEach((col, i) => {
    const bary = (x) => {
      const ps = [...x.pre].filter((p) => pos.has(p));
      return ps.length ? ps.reduce((s, p) => s + pos.get(p), 0) / ps.length : 1e9;
    };
    col.sort((x, y) => (i === 0 ? y.post.size - x.post.size : bary(x) - bary(y)) || natural(x.key, y.key));
    col.forEach((x, j) => pos.set(x, j));
  });
  const els = new Map();
  const graph = h("div", { class: "dg-graph" + (NARROW.matches ? " vert" : "") },
    cols.map((col) => h("div", { class: "dg-col" }, col.map((x) => {
      const el = depsNode(x, c, compact, before);
      els.set(x, el);
      return el;
    }))));
  const svg = document.createElementNS(SVGNS, "svg");
  svg.setAttribute("class", "dg-edges"); svg.setAttribute("aria-hidden", "true");
  graph.prepend(svg);
  deps.chains.push({ graph, svg, els, edges: [...edges.values()].map((e) => ({
    ...e, back: back.has(e.a.key + ">" + e.b.key), skip: level.get(e.b) - level.get(e.a) > 1,
  })) });
  return h("section", { class: "dg-chain" }, graph);
}

function depsNode(x, c, compact, before) {
  if (x.hidden) {
    const label = tr("depsHidden", x.hidden.map((v) => v.ref).join(", "));
    return h("button", { type: "button", class: "dg-pill hid", title: label, "aria-label": label,
      onclick: () => { deps.expanded.add(c.key); render(); } }, "⋯ " + x.hidden.length);
  }
  const v = x.v, it = v.item;
  if (!it) {
    return h("div", { class: "dg-node is-missing", "data-key": v.key, style: "--kc:var(--danger)" },
      h("span", { class: "kbadge" }, "?"),
      h("span", { class: "tx" }, h("span", { class: "dg-t" }, h("b", null, v.ref)), h("span", { class: "dg-sub" }, tr("depsMissingCard"))));
  }
  const k = kindBy(it.kind);
  const kc = `--kc:${k?.color || "#6b7280"}`;
  const closed = isClosed(it);
  const flash = before && !before.has(itemKey(it) + ":" + it.updated_at) ? " flash" : "";
  if (closed && compact) {
    return h("button", { type: "button", class: "dg-pill is-done" + flash, style: kc, "data-key": v.key,
      title: `${it.ref} ${it.title} – ${closedText(it)}`, onclick: () => openEdit(it) }, "✓ " + it.ref);
  }
  const cls = "dg-node" + (closed ? " is-done" : "") + (v.free ? " is-free" : "") + (v.cycle ? " is-cycle" : "") + flash;
  return h("button", { type: "button", class: cls, style: kc, "data-key": v.key, onclick: () => openEdit(it) },
    h("span", { class: "kbadge" }, closed ? "✓" : it.kind),
    h("span", { class: "tx" },
      h("span", { class: "dg-t" }, h("b", null, it.ref), " ", h("span", null, it.title)),
      h("span", { class: "dg-sub" }, depsSub(v))));
}

// The line under a card: frei / what it still waits for / who and how many wait for it
function depsSub(v) {
  const it = v.item, k = kindBy(it.kind);
  if (isClosed(it)) return closedText(it);
  if (v.cycle) return tr("depsInCycle");
  if (v.free) return tr(it.kind === "D" ? "depsFreeD" : k?.actionable ? "depsFreeA" : "depsFree");
  const parts = [];
  const owner = k?.actionable ? it.owner || k.default_owner : null;
  if (owner) parts.push(ownerLabel(owner));
  if (it.status === "doing" || it.status === "blocked") parts.push(STATUS_LABELS[it.status]);
  const waits = v.pre.filter((p) => !v.resolved.includes(p)).map((p) => p.ref);
  if (v.resolved.length && waits.length) parts.push(tr("depsPartly", v.resolved.length, v.pre.length));
  if (waits.length) parts.push(tr("depsWaitsFor", waits.join(", ")));
  if (v.openPost.length) parts.push(tr("depsBlocks", v.openPost.length));
  return parts.join(" · ");
}

// "Auffällig": cycles, unknown references, freed items, what holds up most, your turn – over all chains in view
function depsNotes(m) {
  const shown = m.shown.flatMap((c) => c.nodes);
  const inView = new Set(shown);
  const label = (v) => qref(v.slug, v.ref);
  const color = (v) => (v.item ? kindBy(v.item.kind)?.color || "#6b7280" : "var(--danger)");
  const row = (v, why, sub = v.item?.title) => ({ v, text: label(v), kc: color(v), sub, why });
  const notes = [];
  const cycles = m.cycles.filter((part) => inView.has(part[0]));
  if (cycles.length) notes.push({ bad: true, title: tr("depsCycles"), rows: cycles.map((part) => {
    const path = cyclePath(part);
    return row(path[0], tr("depsCycleWhy"), path.map(label).join(" → "));
  }) });
  const missing = shown.filter((v) => !v.item);
  if (missing.length) notes.push({ bad: true, title: tr("depsMissing"), rows: missing.map((v) => row(v, tr("depsMissingWhy", v.post.map(label).join(", ")), null)) });
  const freed = shown.filter((v) => v.free);
  if (freed.length) notes.push({ title: tr("depsFreed"), rows: freed.map((v) => row(v, tr("depsFreedWhy", v.resolved.map(label).join(", ")))) });
  // holds up the most: everything still open behind an item, not only what waits for it directly
  const behind = (v) => {
    const seen = new Set(), todo = [...v.post];
    while (todo.length) { const w = todo.pop(); if (w === v || seen.has(w)) continue; seen.add(w); todo.push(...w.post); }
    return [...seen].filter((w) => w.open).length;
  };
  const holds = shown.filter((v) => v.open).map((v) => [v, behind(v)]).filter(([, n]) => n >= 2)
    .sort((a, b) => b[1] - a[1] || natural(a[0].key, b[0].key)).slice(0, 3);
  if (holds.length) notes.push({ title: tr("depsHolds"), rows: holds.map(([v, n]) => row(v, tr("depsHoldsWhy", n, v.openPost.length))) });
  // your turn: yours, nothing left to wait for, and something waits for it
  const me = state.actor === "ai" ? "ai" : "user";
  const yours = shown.filter((v) => {
    const k = v.item && kindBy(v.item.kind);
    return v.open && k?.actionable && (v.item.owner || k.default_owner) === me && v.item.status !== "blocked"
      && v.openPost.length && v.resolved.length === v.pre.length;
  }).sort((a, b) => b.openPost.length - a.openPost.length || natural(a.key, b.key));
  if (yours.length) notes.push({ title: tr("depsYours"), rows: yours.map((v) => row(v, tr("depsBlocks", v.openPost.length))) });
  return notes;
}
function cyclePath(part) {
  const set = new Set(part);
  const start = part.slice().sort((a, b) => natural(a.key, b.key))[0];
  const path = [start];
  let cur = start;
  for (;;) {
    const nx = cur.post.find((w) => set.has(w) && !path.includes(w));

// along the right side), so neither hides behind a card.
function drawDeps() {
  const svgEl = (d, cls) => { const p = document.createElementNS(SVGNS, "path"); p.setAttribute("d", d); if (cls) p.setAttribute("class", cls); return p; };
  for (const ch of deps.chains) {

      return { l, t, r: l + b.width, b: t + b.height, cx: l + b.width / 2, cy: t + b.height / 2 };
    };

      if (e.a === e.b) {

      } else if (e.skip) {
        const x = Math.min(a.l, b.l) - 22;
        d = `M${a.l} ${a.cy} C${x} ${a.cy} ${x} ${b.cy} ${b.l - 7} ${b.cy}`; tip = [b.l, b.cy]; dir = [1, 0];
      } else if (!e.back && !vert) {
        const c = Math.max(18, (b.l - a.r) / 2);
        d = `M${a.r} ${a.cy} C${a.r + c} ${a.cy} ${b.l - c} ${b.cy} ${b.l - 7} ${b.cy}`; tip = [b.l, b.cy]; dir = [1, 0];
      } else if (!e.back) {
        const c = Math.max(12, (b.t - a.b) / 2);
        d = `M${a.cx} ${a.b} C${a.cx} ${a.b + c} ${b.cx} ${b.t - c} ${b.cx} ${b.t - 7}`; tip = [b.cx, b.t]; dir = [0, 1];
      } else if (!vert) {
        const y = Math.min(a.t, b.t) - 26;
        d = `M${a.cx} ${a.t} C${a.cx} ${y} ${b.cx} ${y} ${b.cx} ${b.t - 7}`; tip = [b.cx, b.t]; dir = [0, 1];
      } else {
        const x = Math.max(a.r, b.r) + 24;
        d = `M${a.r} ${a.cy} C${x} ${a.cy} ${x} ${b.cy} ${b.r + 7} ${b.cy}`; tip = [b.r, b.cy]; dir = [-1, 0];

      const cls = e.cycle ? "cycle" : e.done ? "done" : "";
      const [x, y] = tip, [dx, dy] = dir;
      out.push(svgEl(d, cls),
        svgEl(`M${x} ${y} L${x - 8 * dx - 4.5 * dy} ${y - 8 * dy + 4.5 * dx} L${x - 8 * dx + 4.5 * dy} ${y - 8 * dy - 4.5 * dx}Z`, ("head " + cls).trim()));

  const terms = fold(query).split(/\s+/).filter(Boolean);
  if (!terms.length) return [...state.projects, ALL_OPTION];
  const hits = [];
  state.projects.forEach((p, i) => {
    const fields = [p.code, p.name, p.repo, p.slug].map(fold);
    const hay = fields.join("\n");
    if (!terms.every((t) => hay.includes(t))) return;
    const words = hay.split(/[^\p{L}\p{N}]+/u);

const actorLabel = (a) => STRINGS[LANG].actors[a] || a || "–";

// The menu is grouped by scope: this device (appearance, language), projects, the chat footer (applies to every AI),
// access. There is no "Settings" entry: everything here is a setting or an action, each named for what it does.
function openMenu() {
  const go = (fn) => () => { closeDialog(); fn(); };
  const inProject = state.project && state.project !== ALL;
  const sec = (text) => h("h4", { class: "sec" }, text);
  openDialog(
    h("h3", null, tr("menu"), h("button", { class: "close-x", "aria-label": tr("close"), title: tr("close") }, "×")),
    sec(tr("secDevice")),
    themeRow(),
    langRow(),
    installRow(),
    sec(tr("secProjects")),
    h("div", { class: "menu-list" },
      h("button", { type: "button", class: "btn", onclick: go(openNewProject) }, tr("menuNewProject")),
      inProject && !currentProject()?.code ? h("button", { type: "button", class: "btn", onclick: go(openSetCode) }, tr("menuSetCode")) : null,
      inProject ? h("button", { type: "button", class: "btn", onclick: go(async () => copy(await api(P(state.project) + "/status.md"), tr("statusMdCopied"))) }, tr("menuStatusMd")) : null),
    sec(tr("secFooter")),
    h("div", { class: "menu-row" },
      inProject ? h("button", { type: "button", class: "btn", onclick: go(copyFooter) }, tr("footerCopy")) : null,
      h("button", { type: "button", class: "btn", onclick: go(openFooterSettings) }, tr("footerCustomize"))),
    sec(tr("secAccess", ownerLabel(state.actor))),
    h("div", { class: "menu-row" },
      h("a", { class: "btn", href: tr("apiDocs"), target: "_blank", rel: "noopener" }, tr("menuApi")),
      h("button", { type: "button", class: "btn danger", onclick: go(() => { store.set("cotrack.token", null); location.reload(); }) }, tr("signOut"))),
  );
}

// Appearance per device (localStorage): applies at once, the menu stays open.
const THEMES = [["light", "☀️", "themeLight"], ["dark", "🌙", "themeDark"], ["auto", "🖥️", "themeAuto"]];
function setTheme(theme) {
  const root = document.documentElement;
  if (theme === "auto") delete root.dataset.theme; else root.dataset.theme = theme;
  store.set("cotrack.theme", theme === "auto" ? null : theme);
}
function themeRow() {
  const cur = document.documentElement.dataset.theme || "auto";
  const seg = h("div", { class: "seg", role: "group", "aria-label": tr("appearance") }, THEMES.map(([theme, icon, key]) =>
    h("button", { type: "button", title: tr(key), "aria-label": tr(key), "aria-pressed": String(theme === cur),
      onclick: (e) => { setTheme(theme); for (const b of seg.children) b.setAttribute("aria-pressed", String(b === e.currentTarget)); } }, icon)));
  return h("div", { class: "theme-row" }, h("span", { class: "small" }, tr("appearance")), h("span", { class: "spacer" }), seg);
}
// Language per device (localStorage); "Auto" follows the browser. The page reloads so that every text switches.
// Install as an app: Chrome and Edge (Android, desktop) announce it with beforeinstallprompt once manifest and icons
// qualify; the menu then offers it (the browser may also suggest it on its own). Installed, cotrack runs in its own
// window with its own entry in the app switcher. iOS has no such event: the menu names the way via the share sheet.
let installPrompt = null;
window.addEventListener("beforeinstallprompt", (e) => { installPrompt = e; });
window.addEventListener("appinstalled", () => { installPrompt = null; toast(tr("installed")); });
const runsAsApp = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
const isIos = () => /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
function installRow() {
  if (runsAsApp()) return null;
  if (installPrompt) {
    return h("div", { class: "menu-list" }, h("button", { type: "button", class: "btn", onclick: () => {
      const p = installPrompt;
      installPrompt = null; // a prompt can be shown only once
      closeDialog(); p.prompt();
    } }, tr("installApp")));
  }
  return isIos() ? h("p", { class: "small" }, tr("installIos")) : null;
}
function langRow() {
  const cur = LANGS.includes(store.get("cotrack.lang")) ? store.get("cotrack.lang") : "auto";
  const opts = [["auto", "Auto", tr("langAuto")], ["de", "DE", "Deutsch"], ["en", "EN", "English"]];
  return h("div", { class: "theme-row" }, h("span", { class: "small" }, tr("language")), h("span", { class: "spacer" }),
    h("div", { class: "seg txt", role: "group", "aria-label": tr("language") }, opts.map(([value, label, title]) =>
      h("button", { type: "button", title, "aria-label": title, "aria-pressed": String(value === cur),
        onclick: () => { if (value === cur) return; store.set("cotrack.lang", value === "auto" ? null : value); location.reload(); } }, label))));
}

const currentProject = () => state.projects.find((p) => p.slug === state.project);

// Instance settings: shape the footer the server returns to every AI (MCP and API). When it appears is up to the prompt.
async function openFooterSettings() {
  let data;
  try { data = await api("/settings"); } catch (err) { return toast(tr("error", err.message)); }
  const { settings: s, defaults: d, available } = data;
  const canEdit = available && state.actor === "user";
  const layout = h("select", { disabled: !canEdit },
    h("option", { value: "multi", selected: s.footer_layout === "multi" }, tr("layoutMulti")),
    h("option", { value: "single", selected: s.footer_layout === "single" }, tr("layoutSingle")));
  // An empty field means the built-in default (shown as placeholder).
  const labelInput = (value, def) => h("input", { value: value === def ? "" : value, placeholder: tr("defaultMark", def), maxlength: "16", disabled: !canEdit });
  const user = labelInput(s.footer_label_user, d.footer_label_user);
  const ai = labelInput(s.footer_label_ai, d.footer_label_ai);
  const preview = h("pre", { class: "preview", "aria-live": "polite" });
  const marker = (input, def) => input.value.trim().replace(/:+$/, "") || def;
  const showPreview = () => {
    const [mine, theirs, idea, warning] = tr("preview");
    const groups = [`${marker(user, d.footer_label_user)}: ${mine}`, `${marker(ai, d.footer_label_ai)}: ${theirs}`, "💡 " + idea, "⚠️ " + warning];
    preview.textContent = groups.join(layout.value === "single" ? " · " : "\n");
  };
  for (const el of [layout, user, ai]) el.addEventListener("input", showPreview);
  showPreview();
  const save = async (body, msg) => {
    try {
      await api("/settings", { method: "PATCH", body });
      closeDialog(); toast(msg); renderFooter();
    } catch (err) { toast(tr("error", err.message)); }
  };
  const dlg = openDialog(
    h("h3", null, tr("footerDialog")),
    h("p", { class: "small" }, tr("settingsIntro")),
    field(tr("defaultLayout"), layout),
    h("div", { class: "row2" }, field(tr("markerUser"), user), field(tr("markerAi"), ai)),
    h("p", { class: "small" }, tr("previewLabel")),
    preview,
    h("p", { class: "small" }, tr("settingsNote")),
    !available ? h("p", { class: "small", style: "color:var(--danger)" }, tr("settingsMigration")) : null,
    available && state.actor !== "user" ? h("p", { class: "small", style: "color:var(--danger)" }, tr("settingsAiToken")) : null,
    h("div", { class: "actions" },
      canEdit ? h("button", { type: "button", class: "btn", onclick: () => save({ footer_layout: null, footer_label_user: null, footer_label_ai: null }, tr("defaultsRestored")) }, tr("defaults")) : null,
      h("span", { class: "spacer" }),
      h("button", { type: "button", class: "btn", onclick: dismissDialog }, tr("close")),
      canEdit ? h("button", { class: "primary" }, tr("save")) : null),
  );
  dlg.querySelector("form").addEventListener("submit", (e) => {
    e.preventDefault();
    if (!canEdit) return closeDialog();
    save({ footer_layout: layout.value, footer_label_user: user.value.trim() || null, footer_label_ai: ai.value.trim() || null }, tr("settingsSaved"));
  });
}

function openSetCode() {
  const p = currentProject();
  const code = h("input", { required: true, pattern: "[A-Za-z]{2}[A-Za-z0-9]{0,2}", maxlength: "4", placeholder: tr("codePh"), style: "text-transform:uppercase" });
  const d = openDialog(
    h("h3", null, tr("codeFor", p.name)),
    h("p", { class: "small" }, tr("codeHelp")),
    field(tr("code"), code),
    h("div", { class: "actions" }, h("button", { type: "button", class: "btn", onclick: dismissDialog }, tr("cancel")), h("button", { class: "primary" }, tr("setCode"))),
  );
  d.querySelector("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    try {
      await api(P(p.slug), { method: "PATCH", body: { code: code.value.trim() } });
      closeDialog(); await loadProjects(); toast(tr("codeSet"));
    } catch (err) { toast(tr("error", err.message)); }
  });
}

function openNewProject() {
  const slug = h("input", { required: true, pattern: "[a-z0-9][a-z0-9\\-]{0,62}", placeholder: tr("slugPh") });
  const name = h("input", { placeholder: tr("namePh") });
  const repo = h("input", { placeholder: tr("repoPh") });
  const code = h("input", { pattern: "[A-Za-z]{2}[A-Za-z0-9]{0,2}", maxlength: "4", placeholder: tr("codePhNew"), style: "text-transform:uppercase" });
  let timer;
  const suggest = () => {
    clearTimeout(timer);
    timer = setTimeout(async () => {
      const s = slug.value.trim();
      if (!/^[a-z0-9][a-z0-9-]*$/.test(s)) return;
      try { const r = await api("/code-suggestion?slug=" + encodeURIComponent(s)); code.placeholder = r.code ? tr("codeSuggested", r.code) : tr("codeChars"); } catch { /* suggestion is optional */ }
    }, 250);
  };
  repo.addEventListener("input", () => {
    const r = repo.value.trim().split("/")[1];
    if (r && !slug.dataset.touched) { slug.value = r.toLowerCase().replace(/[^a-z0-9-]/g, "-"); suggest(); }
  });
  slug.addEventListener("input", () => { slug.dataset.touched = "1"; suggest(); });
  const d = openDialog(
    h("h3", null, tr("newProjectTitle")),
    field(tr("fRepo"), repo), field(tr("fSlug"), slug), h("div", { class: "row2" }, field(tr("fName"), name), field(tr("code"), code)),
    h("p", { class: "small" }, tr("codeNote")),
    h("div", { class: "actions" }, h("button", { type: "button", class: "btn", onclick: dismissDialog }, tr("cancel")), h("button", { class: "primary" }, tr("create"))),
  );
  d.querySelector("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    try {
      const { project } = await api("/projects", { method: "POST", body: { slug: slug.value.trim(), name: name.value.trim() || undefined, repo: repo.value.trim() || undefined, code: code.value.trim() || undefined } });
      closeDialog(); await loadProjects(); selectProject(project.slug); toast(tr("projectCreated"));
    } catch (err) { toast(tr("error", err.message)); }
  });
}

function showLogin(msg) {
  const input = h("input", { type: "password", required: true, autocomplete: "current-password", placeholder: tr("token") });
  const d = openDialog(
    h("h3", null, "co", h("b", { style: "color:var(--accent)" }, "track"), tr("signInTitle")),
    msg ? h("p", { class: "small", style: "color:var(--danger)" }, msg) : null,
    h("p", { class: "small" }, tr("tokenHelp")),
    field(tr("token"), input),
    h("div", { class: "actions" }, h("button", { class: "primary" }, tr("signIn"))),
  );
  d.dataset.locked = "1";
  d.querySelector("form").addEventListener("submit", (e) => {
    e.preventDefault(); state.token = input.value.trim(); store.set("cotrack.token", state.token); closeDialog(); boot();
  });
}

/* ---------------------------------------------------------- layout */
// --top-h: height of the sticky top bar (the filter bar sticks below it). --dock: how high the floating "+" and its
// sheet sit – above the footer line, or above the on-screen keyboard while it covers the page (iOS Safari and Chrome
// on Android shrink only the visual viewport). --toast-up: toasts appear above the "+" and an open sheet.
function updateMetrics() {
  const css = document.documentElement.style;
  css.setProperty("--top-h", $(".top").offsetHeight + "px");
  const vv = window.visualViewport;
  const kb = vv && Math.abs(vv.scale - 1) < 0.01 ? Math.round(window.innerHeight - vv.height - vv.offsetTop) : 0;
  const foot = $(".footline");
  css.setProperty("--dock", (kb > 60 ? kb : foot.hidden ? 0 : foot.offsetHeight) + "px");
  document.documentElement.classList.toggle("kb", kb > 60);
  css.setProperty("--toast-up", ($("#add").hidden ? 78 : 86 + $("#add").offsetHeight) + "px");
  markStuck();
}
// A thin line under the filter bar while it sticks.
function markStuck() {
  const topH = $(".top").offsetHeight;
  for (const el of [$("#bar"), $("#filterBar")]) {
    const sticks = el.getClientRects().length > 0 && getComputedStyle(el).position === "sticky";
    el.classList.toggle("stuck", sticks && window.scrollY > 0 && el.getBoundingClientRect().top <= topH + 1);
  }
}
// From 1180px everything fits into the top bar: the filter bar moves there and the board starts one row higher.
const WIDE = matchMedia("(min-width: 1180px)");
function placeBar() {
  const bar = $("#bar"), top = $(".top"), focused = document.activeElement;
  if (WIDE.matches && bar.parentElement !== top) top.insertBefore(bar, top.querySelector(".spacer"));
  else if (!WIDE.matches && bar.parentElement === top) $("main").prepend(bar);
  top.classList.toggle("with-bar", WIDE.matches);
  if (bar.contains(focused)) focused.focus();
  updateMetrics();
}
WIDE.addEventListener("change", placeBar);
let frame = 0;
window.addEventListener("scroll", () => { if (!frame) frame = requestAnimationFrame(() => { frame = 0; markStuck(); }); }, { passive: true });
window.addEventListener("resize", () => { updateMetrics(); fitFilterBar(); });
window.visualViewport?.addEventListener("resize", updateMetrics);
window.visualViewport?.addEventListener("scroll", updateMetrics);
const sizes = new ResizeObserver(() => updateMetrics());
for (const el of [$(".top"), $(".footline"), $("#add")]) sizes.observe(el);
placeBar();

boot();
</script>
