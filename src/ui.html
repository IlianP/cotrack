<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>cotrack</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f766e'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11.5' stroke='white' stroke-width='3.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #f6f6f3; --surface: #ffffff; --surface-2: #f0f0ec; --text: #1d1d1b; --muted: #6a6a64;
  --line: #e2e2dc; --accent: #0f766e; --accent-ink: #ffffff; --danger: #b91c1c;
  --radius: 12px; --shadow: 0 1px 2px rgb(0 0 0 / .05), 0 2px 8px rgb(0 0 0 / .04);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #131312; --surface: #1c1c1a; --surface-2: #252522; --text: #ededE8; --muted: #9b9b94;
    --line: #30302c; --accent: #2dd4bf; --accent-ink: #062b27; --danger: #f87171;
    --shadow: none; color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  padding-bottom: calc(76px + env(safe-area-inset-bottom));
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* top bar */
.top {
  position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 10px;
  padding: 10px 16px; padding-top: calc(10px + env(safe-area-inset-top));
  background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
}
.brand { font-weight: 700; letter-spacing: -.02em; font-size: 18px; white-space: nowrap; }
.brand b { color: var(--accent); }
.top select {
  min-width: 0; flex: 1 1 auto; max-width: 340px; padding: 7px 10px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--surface);
}
.live { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; transition: background .3s; }
.live.on { background: #16a34a; box-shadow: 0 0 0 3px color-mix(in srgb, #16a34a 25%, transparent); }
.live.off { background: var(--danger); }
.icon-btn {
  border: 1px solid var(--line); background: var(--surface); border-radius: 10px;
  min-width: 38px; height: 38px; padding: 0 10px; flex: none;
}
.spacer { flex: 1; }

main { max-width: 1400px; margin: 0 auto; padding: 14px 16px; }

/* quick add */
.add {
  display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow);
}
.add[aria-disabled="true"] { opacity: .55; pointer-events: none; }
.seg { display: flex; gap: 4px; flex: none; }
.seg button {
  border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px;
  min-width: 38px; height: 38px; font-weight: 700;
}
.seg button[aria-pressed="true"] { background: var(--kc, var(--accent)); color: #fff; border-color: transparent; }
.add input { flex: 1 1 220px; min-width: 0; height: 38px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); }
.primary { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 8px; height: 38px; padding: 0 16px; font-weight: 600; }
.hint { width: 100%; margin: 0; color: var(--muted); font-size: 12.5px; }

/* filters */
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 14px 0 10px; }
.chips { display: flex; gap: 4px; background: var(--surface-2); padding: 3px; border-radius: 10px; }
.chips button { border: 0; background: transparent; padding: 5px 12px; border-radius: 8px; color: var(--muted); }
.chips button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow); font-weight: 600; }
.filters input[type=search] {
  flex: 1 1 160px; max-width: 280px; height: 34px; padding: 0 10px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--surface);
}

/* board */
.board { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); align-items: start; }
.col { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
.col-head { display: flex; align-items: center; gap: 10px; padding: 11px 14px; border-bottom: 1px solid var(--line); }
.col-head h2 { margin: 0; font-size: 14.5px; font-weight: 650; flex: 1; }
.col-head .count { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 13px; }
.kbadge {
  display: inline-grid; place-items: center; min-width: 24px; height: 24px; padding: 0 5px; border-radius: 7px;
  background: var(--kc); color: #fff; font-weight: 700; font-size: 13px;
}
.items { list-style: none; margin: 0; padding: 4px 0; }
.empty { color: var(--muted); padding: 14px; margin: 0; font-size: 14px; }
.item { display: flex; gap: 10px; padding: 9px 12px; align-items: flex-start; border-radius: 8px; margin: 0 4px; }
.item:hover { background: var(--surface-2); }
.item.flash { animation: flash 1.2s ease-out; }
@keyframes flash { from { background: color-mix(in srgb, var(--kc) 22%, transparent); } }
.check {
  flex: none; width: 22px; height: 22px; margin-top: 1px; border-radius: 50%;
  border: 2px solid color-mix(in srgb, var(--kc) 70%, var(--line)); background: transparent; padding: 0;
  display: grid; place-items: center; color: #fff; font-size: 12px; line-height: 1;
}
.check:hover { background: color-mix(in srgb, var(--kc) 18%, transparent); }
.is-done .check { background: var(--kc); border-color: var(--kc); }
.item .main { flex: 1; min-width: 0; cursor: pointer; }
.l1 { display: flex; gap: 7px; align-items: baseline; }
.ref {
  flex: none; border: 0; background: color-mix(in srgb, var(--kc) 14%, transparent); color: var(--kc);
  font-weight: 700; font-size: 12.5px; padding: 1px 6px; border-radius: 6px; font-variant-numeric: tabular-nums;
}
@media (prefers-color-scheme: dark) { .ref { color: color-mix(in srgb, var(--kc) 60%, white); } }
.title { overflow-wrap: anywhere; }
.is-done .title { color: var(--muted); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--muted) 60%, transparent); }
.desc { margin: 3px 0 0; color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.meta { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 5px; }
.pill { font-size: 12px; padding: 1px 7px; border-radius: 99px; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pill.wait { color: #b45309; border-color: color-mix(in srgb, #d97706 40%, var(--line)); }
.pill.next { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }
.pill.st-doing { color: var(--accent); }
.pill.st-blocked { color: var(--danger); }
.pill a { color: inherit; }

/* footer line */
.footline {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; display: flex; gap: 10px; align-items: center;
  padding: 10px 16px; padding-bottom: calc(10px + env(safe-area-inset-bottom));
  background: var(--surface); border-top: 1px solid var(--line);
}
.footline[hidden] { display: none; }
.footline code {
  flex: 1; min-width: 0; font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted);
  overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
}

/* dialogs */
dialog {
  border: 1px solid var(--line); border-radius: 16px; background: var(--surface); color: var(--text);
  padding: 0; width: min(560px, calc(100vw - 24px)); max-height: calc(100dvh - 24px);
}
dialog::backdrop { background: rgb(0 0 0 / .4); }
.dlg { padding: 18px; display: grid; gap: 12px; }
.dlg h3 { margin: 0; font-size: 17px; display: flex; gap: 8px; align-items: center; }
.dlg label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
.dlg input, .dlg select, .dlg textarea {
  width: 100%; padding: 9px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font-size: 15px;
}
.dlg textarea { min-height: 90px; resize: vertical; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
.btn { border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; height: 38px; padding: 0 14px; }
.btn.danger { color: var(--danger); }
.small { font-size: 12.5px; color: var(--muted); margin: 0; }
.menu-list { display: grid; gap: 6px; }
.menu-list button { text-align: left; }
.dlg h4 { margin: 4px 0 0; font-size: 14px; }
.preview {
  margin: 0; padding: 10px 12px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--line);
  font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; overflow-wrap: anywhere;
}

#toast {
  position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px);
  background: var(--text); color: var(--bg); padding: 8px 14px; border-radius: 10px; font-size: 14px;
  opacity: 0; pointer-events: none; transition: .2s; z-index: 20; max-width: calc(100vw - 32px);
}
#toast.show { opacity: 1; transform: translateX(-50%); }

@media (max-width: 560px) {
  .brand span { display: none; }
  .row2 { grid-template-columns: 1fr; }
  .board { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<header class="top">
  <div class="brand">co<b>track</b></div>
  <label class="sr" for="project">Projekt</label>
  <select id="project"></select>
  <span id="live" class="live" title="Live-Verbindung"></span>
  <span class="spacer"></span>
  <button id="menuBtn" class="icon-btn" aria-label="Menü">☰</button>
</header>

<main>
  <form id="add" class="add" autocomplete="off">
    <div id="kindSeg" class="seg" role="group" aria-label="Kategorie"></div>
    <div id="ownerSeg" class="seg" role="group" aria-label="Verantwortlich"></div>
    <label class="sr" for="addTitle">Neuer Punkt</label>
    <input id="addTitle" placeholder="Neuer Punkt … z. B. „Lizenz wählen“" enterkeyhint="done">
    <button class="primary" type="submit">Hinzufügen</button>
    <p class="hint" id="addHint"></p>
  </form>

  <div class="filters">
    <div class="chips" id="viewChips" role="group" aria-label="Ansicht">
      <button data-view="open" aria-pressed="true">Offen</button>
      <button data-view="closed" aria-pressed="false">Erledigt</button>
      <button data-view="all" aria-pressed="false">Alle</button>
    </div>
    <input type="search" id="search" placeholder="Suchen …" aria-label="Suchen">
  </div>

  <div id="board" class="board"></div>
</main>

<footer class="footline">
  <code id="footerText" title="Fußzeile für den Chat"></code>
  <button id="copyFooter" class="btn">Kopieren</button>
</footer>

<dialog id="dlg"></dialog>
<div id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
const $ = (s) => document.querySelector(s);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} },
};
const OWNER_LABELS = { user: "Du", ai: "KI" };
const STATUS_LABELS = { open: "offen", doing: "in Arbeit", blocked: "blockiert", done: "erledigt", dropped: "verworfen" };
const ALL = "*";

const state = {
  token: store.get("cotrack.token"),
  project: decodeURIComponent(location.hash.slice(1)) || store.get("cotrack.project") || "",
  view: "open", q: "", kinds: [], projects: [], items: [], version: -1,
  actor: null, addKind: null, addOwner: "user", allKinds: [], lastRefs: new Set(),
};

/* tiny DOM helper: never uses innerHTML, so user text cannot inject markup */
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "style") el.style.cssText = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat(Infinity)) if (c != null && c !== false) el.append(c instanceof Node ? c : String(c));
  return el;
}

async function api(path, { method = "GET", body } = {}) {
  const res = await fetch("/api" + path, {
    method,
    headers: { authorization: "Bearer " + state.token, ...(body ? { "content-type": "application/json" } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (res.status === 401) { showLogin("Token ungültig oder abgelaufen."); throw new Error("unauthorized"); }
  const isJson = (res.headers.get("content-type") || "").includes("json");
  const data = isJson ? await res.json() : await res.text();
  if (!res.ok) throw new Error((data && data.error ? data.error + (data.detail ? ": " + data.detail : "") : res.status));
  return data;
}
const P = (slug) => "/projects/" + encodeURIComponent(slug);

function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 1800);
}
async function copy(text, label = "Kopiert") {
  try { await navigator.clipboard.writeText(text); toast(label); }
  catch { prompt("Zum Kopieren:", text); }
}
const kindBy = (code) => state.allKinds.find((k) => k.code === code);
const needsOwner = (k) => k && k.actionable && !k.default_owner;
const ownerLabel = (o) => OWNER_LABELS[o] || o || "–";

/* ---------------------------------------------------------- loading */
async function boot() {
  if (!state.token) return showLogin();
  try {
    const [me, kinds] = await Promise.all([api("/me"), api("/kinds?all=1")]);
    state.actor = me.actor; state.allKinds = kinds.kinds; state.kinds = kinds.kinds.filter((k) => k.active);
    state.addKind = state.addKind || state.kinds[0]?.code;
    await loadProjects();
    renderKindSeg();
    await refresh(true);
    if (!boot.started) {
      boot.started = true;
      setInterval(poll, 4000);
      document.addEventListener("visibilitychange", poll);
    }
    poll();
  } catch (e) { if (e.message !== "unauthorized") toast("Fehler: " + e.message); }
}

async function loadProjects() {
  state.projects = (await api("/projects")).projects;
  if (state.project !== ALL && !state.projects.some((p) => p.slug === state.project)) {
    state.project = state.projects[0]?.slug || "";
  }
  renderProjects();
}

async function refresh(force) {
  if (!state.project) { state.items = []; render(); return; }
  // Responses for an older selection (project, view, search) are discarded.
  const req = (state.reqId = (state.reqId || 0) + 1);
  const path = state.project === ALL ? "/items" : P(state.project) + "/items";
  const params = new URLSearchParams({ status: state.view });
  if (state.q) params.set("q", state.q);
  const { items } = await api(path + "?" + params);
  if (req !== state.reqId) return;
  const before = state.lastRefs;
  state.items = items;
  state.lastRefs = new Set(items.map((i) => i.project_slug + ":" + i.ref + ":" + i.updated_at));
  render(force ? null : before);
  renderFooter();
}

async function poll() {
  if (document.hidden || !state.token || !state.project) return;
  const project = state.project;
  try {
    const v = await api(project === ALL ? "/version" : P(project) + "/version");
    if (project !== state.project) return;
    // Only acknowledge a version once the refresh for it succeeded, so a failed refresh is retried.
    if (v.version !== state.version) {
      if (state.version !== -1) { await refresh(false); loadProjects(); }
      if (project === state.project) state.version = v.version;
    }
    setLive(true);
  } catch { setLive(false); }
}
function setLive(ok) { const l = $("#live"); l.className = "live " + (ok ? "on" : "off"); l.title = ok ? "Live: verbunden" : "Keine Verbindung"; }

/* ---------------------------------------------------------- render */
function renderProjects() {
  const sel = $("#project");
  sel.replaceChildren(
    ...state.projects.map((p) => h("option", { value: p.slug }, `${p.code ? p.code + " · " : ""}${p.name}${p.open_count ? ` (${p.open_count})` : ""}`)),
    h("option", { value: ALL }, "Alle Projekte"),
  );
  sel.value = state.project;
  const disabled = state.project === ALL || !state.project;
  $("#add").setAttribute("aria-disabled", disabled);
  $("#footerText").parentElement.hidden = state.project === ALL;
}

function renderKindSeg() {
  const seg = $("#kindSeg");
  seg.replaceChildren(...state.kinds.map((k) => h("button", {
    type: "button", "aria-pressed": String(k.code === state.addKind), title: k.name,
    style: `--kc:${k.color || "var(--accent)"}`,
    onclick: () => { state.addKind = k.code; renderKindSeg(); $("#addTitle").focus(); },
  }, k.code)));
  const k = kindBy(state.addKind);
  $("#ownerSeg").replaceChildren(...(needsOwner(k) ? ["user", "ai"].map((o) => h("button", {
    type: "button", "aria-pressed": String(o === state.addOwner), title: "Verantwortlich",
    onclick: () => { state.addOwner = o; renderKindSeg(); $("#addTitle").focus(); },
  }, OWNER_LABELS[o])) : []));
  $("#addHint").textContent = k ? `${k.name}: ${k.description || ""} · Tipp: „I: …“ wählt die Kategorie per Kürzel.` : "";
}

// ref -> open items waiting for it (reverse of waiting_on, computed from what is on screen)
let successors = new Map();
function render(before) {
  successors = new Map();
  for (const i of state.items) {
    if (i.status === "done" || i.status === "dropped") continue;
    for (const r of (i.waiting_on || "").split(",").filter(Boolean)) {
      const key = i.project_slug + ":" + r;
      successors.set(key, [...(successors.get(key) || []), i.ref]);
    }
  }
  const board = $("#board");
  if (!state.project) {
    board.replaceChildren(h("div", { class: "col" }, h("p", { class: "empty" }, "Noch kein Projekt. Lege über ☰ ein neues an.")));
    return;
  }
  // Inactive kinds (e.g. legacy "T") only get a column while they still have items in view.
  const legacy = state.allKinds.filter((k) => !k.active && state.items.some((i) => i.kind === k.code));
  const known = new Set(state.allKinds.map((k) => k.code));
  const extra = [...new Set(state.items.map((i) => i.kind).filter((c) => !known.has(c)))]
    .map((c) => ({ code: c, name: c, color: "#6b7280" }));
  board.replaceChildren(...[...state.kinds, ...legacy, ...extra].map((k) => {
    const list = state.items.filter((i) => i.kind === k.code);
    return h("section", { class: "col", style: `--kc:${k.color || "#6b7280"}` },
      h("header", { class: "col-head" },
        h("span", { class: "kbadge" }, k.code), h("h2", null, k.name), h("span", { class: "count" }, list.length)),
      list.length
        ? h("ul", { class: "items" }, list.map((it) => renderItem(it, k, before)))
        : h("p", { class: "empty" }, state.view === "open" ? "Nichts offen 🎉" : "Keine Einträge"));
  }));
}

function renderItem(it, k, before) {
  const closed = it.status === "done" || it.status === "dropped";
  const meta = [];
  if (state.project === ALL) {
    const pr = state.projects.find((p) => p.slug === it.project_slug);
    meta.push(h("span", { class: "pill", title: it.project_slug }, pr?.code || it.project_slug));
  }
  for (const r of (it.waiting_on || "").split(",").filter(Boolean)) meta.push(h("span", { class: "pill wait", title: "wartet auf" }, "⏸ " + r));
  const next = successors.get(it.project_slug + ":" + it.ref);
  if (next) meta.push(h("span", { class: "pill next", title: "danach folgt" }, "▶ " + next.join(", ")));
  if (it.status !== "open" && it.status !== "done") meta.push(h("span", { class: "pill st-" + it.status }, STATUS_LABELS[it.status]));
  if (it.converted_to) meta.push(h("span", { class: "pill" }, "→ " + it.converted_to));
  if (k.actionable && it.owner && it.owner !== k.default_owner) meta.push(h("span", { class: "pill" }, (it.owner === "ai" ? "🤖 " : "👤 ") + ownerLabel(it.owner)));
  if (it.due) meta.push(h("span", { class: "pill" }, "📅 " + it.due));
  if (it.source) meta.push(h("span", { class: "pill" }, /^https?:\/\//.test(it.source)
    ? h("a", { href: it.source, target: "_blank", rel: "noopener noreferrer", onclick: (e) => e.stopPropagation() }, "🔗 Quelle")
    : "📄 " + it.source));
  const key = it.project_slug + ":" + it.ref + ":" + it.updated_at;
  const changed = before && !before.has(key);
  return h("li", { class: `item${closed ? " is-done" : ""}${changed ? " flash" : ""}` },
    h("button", { class: "check", title: closed ? "Wieder öffnen" : "Erledigt", "aria-label": `${it.ref} ${closed ? "wieder öffnen" : "erledigt"}`,
      onclick: () => setStatus(it, closed ? "open" : "done") }, closed ? "✓" : ""),
    h("div", { class: "main", onclick: () => openEdit(it) },
      h("div", { class: "l1" },
        h("button", { class: "ref", title: "Kennung + Titel kopieren", onclick: (e) => { e.stopPropagation(); copy(`${it.ref} ${it.title}`); } }, it.ref),
        h("span", { class: "title" }, it.title)),
      it.body ? h("p", { class: "desc" }, it.body.length > 160 ? it.body.slice(0, 160) + " …" : it.body) : null,
      meta.length ? h("div", { class: "meta" }, meta) : null));
}

async function renderFooter() {
  if (!state.project || state.project === ALL) return;
  try {
    const { footer } = await api(P(state.project) + "/footer?layout=single");
    $("#footerText").textContent = footer || "Nichts offen.";
  } catch {}
}

/* ---------------------------------------------------------- actions */
async function setStatus(it, status) {
  try {
    await api(P(it.project_slug) + "/items/" + it.ref, { method: "PATCH", body: { status } });
    toast(`${it.ref} ${STATUS_LABELS[status]}`);
    await refresh(false);
  } catch (e) { toast("Fehler: " + e.message); }
}

$("#add").addEventListener("submit", async (e) => {
  e.preventDefault();
  let title = $("#addTitle").value.trim();
  if (!title) return;
  let kind = state.addKind;
  // Prefix shortcut: "I: Dark mode" switches the category
  const m = title.match(/^([A-Za-z]{1,4}):\s*(.+)$/);
  if (m && kindBy(m[1].toUpperCase())) {
    kind = m[1].toUpperCase(); title = m[2];
  }
  try {
    const { item } = await api(P(state.project) + "/items", { method: "POST", body: { kind, title, ...(needsOwner(kindBy(kind)) ? { owner: state.addOwner } : {}) } });
    $("#addTitle").value = "";
    toast(`${item.ref} angelegt`);
    await refresh(false);
  } catch (err) { toast("Fehler: " + err.message); }
});

$("#viewChips").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  state.view = b.dataset.view;
  for (const x of $("#viewChips").children) x.setAttribute("aria-pressed", String(x === b));
  refresh(true);
});
let searchT;
$("#search").addEventListener("input", (e) => { clearTimeout(searchT); searchT = setTimeout(() => { state.q = e.target.value.trim(); refresh(true); }, 250); });
$("#project").addEventListener("change", (e) => selectProject(e.target.value));
// The bar shows the compact single line; the copy button gives the chat format (default layout).
const copyFooter = async () => copy((await api(P(state.project) + "/footer")).footer, "Fußzeile kopiert");
$("#copyFooter").addEventListener("click", () => copyFooter().catch((err) => toast("Fehler: " + err.message)));
$("#menuBtn").addEventListener("click", openMenu);
window.addEventListener("hashchange", () => { const s = decodeURIComponent(location.hash.slice(1)); if (s && s !== state.project) selectProject(s); });

function selectProject(slug) {
  state.project = slug; state.version = -1;
  store.set("cotrack.project", slug);
  history.replaceState(null, "", "#" + encodeURIComponent(slug));
  renderProjects(); refresh(true); poll();
}

/* ---------------------------------------------------------- dialogs */
function openDialog(...content) {
  const d = $("#dlg");
  d.replaceChildren(h("form", { class: "dlg", method: "dialog" }, ...content));
  if (!d.open) d.showModal();
  return d;
}
const closeDialog = () => $("#dlg").close();
const field = (label, input) => h("label", null, label, input);

function openEdit(it) {
  const k = kindBy(it.kind) || { name: it.kind, color: "#6b7280" };
  const f = {
    title: h("input", { value: it.title, required: true, maxlength: 500 }),
    short: h("input", { value: it.short || "", maxlength: 40, placeholder: "1–3 Wörter für die Fußzeile" }),
    body: h("textarea", { maxlength: 20000 }, it.body || ""),
    owner: h("select", null, ["user", "ai"].map((o) => h("option", { value: o, selected: it.owner === o }, OWNER_LABELS[o])),
      it.owner && !OWNER_LABELS[it.owner] ? h("option", { value: it.owner, selected: true }, it.owner) : null,
      h("option", { value: "" , selected: !it.owner }, "– niemand –")),
    status: h("select", null, Object.entries(STATUS_LABELS).map(([v, l]) => h("option", { value: v, selected: it.status === v }, l))),
    waiting_on: h("input", { value: (it.waiting_on || "").replace(/,/g, ", "), placeholder: "z. B. T2, A1" }),
    source: h("input", { value: it.source || "", placeholder: "Link oder Datei" }),
    due: h("input", { type: "date", value: it.due || "" }),
  };
  const save = async (e) => {
    e.preventDefault();
    const body = {};
    for (const [key, el] of Object.entries(f)) body[key] = el.value;
    try {
      await api(P(it.project_slug) + "/items/" + it.ref, { method: "PATCH", body });
      closeDialog(); toast(`${it.ref} gespeichert`); refresh(false);
    } catch (err) { toast("Fehler: " + err.message); }
  };
  const del = async () => {
    if (!confirm(`${it.ref} endgültig löschen? Die Kennung wird nicht neu vergeben.`)) return;
    try { await api(P(it.project_slug) + "/items/" + it.ref, { method: "DELETE" }); closeDialog(); toast(`${it.ref} gelöscht`); refresh(false); }
    catch (err) { toast("Fehler: " + err.message); }
  };
  const convertTargets = state.kinds.filter((x) => x.actionable && !k.actionable);
  const convert = async (code) => {
    try {
      const r = await api(P(it.project_slug) + "/items/" + it.ref + "/convert", { method: "POST", body: { kind: code } });
      closeDialog(); toast(`${it.ref} → ${r.to.ref}`); refresh(false);
    } catch (err) { toast("Fehler: " + err.message); }
  };
  const d = openDialog(
    h("h3", { style: `--kc:${k.color}` }, h("span", { class: "kbadge" }, it.ref), k.name),
    field("Titel", f.title),
    field("Beschreibung", f.body),
    h("div", { class: "row2" }, field("Kurzlabel", f.short), field("Verantwortlich", f.owner)),
    h("div", { class: "row2" }, field("Status", f.status), field("Wartet auf", f.waiting_on)),
    h("div", { class: "row2" }, field("Quelle", f.source), field("Fällig", f.due)),
    h("p", { class: "small" }, `Angelegt ${fmt(it.created_at)} von ${ownerLabel(it.created_by)} · geändert ${fmt(it.updated_at)} von ${ownerLabel(it.updated_by)}`),
    !it.converted_to && convertTargets.length ? h("div", { class: "actions", style: "justify-content:flex-start" },
      h("span", { class: "small", style: "align-self:center" }, "Zusagen →"),
      convertTargets.map((t) => h("button", { type: "button", class: "btn", onclick: () => convert(t.code) }, `als ${t.code} (${t.name})`))) : null,
    h("div", { class: "actions" },
      h("button", { type: "button", class: "btn danger", onclick: del }, "Löschen"),
      h("button", { type: "button", class: "btn", onclick: () => copy(`${it.ref} ${it.title}`) }, "Kopieren"),
      h("span", { class: "spacer" }),
      h("button", { type: "button", class: "btn", onclick: closeDialog }, "Abbrechen"),
      h("button", { type: "submit", class: "primary" }, "Speichern")),
  );
  d.querySelector("form").addEventListener("submit", save);
}
const fmt = (iso) => iso ? new Date(iso).toLocaleString("de-DE", { dateStyle: "short", timeStyle: "short" }) : "–";

function openMenu() {
  const go = (fn) => () => { closeDialog(); fn(); };
  const inProject = state.project && state.project !== ALL;
  openDialog(
    h("h3", null, "Menü"),
    h("div", { class: "menu-list" },
      h("button", { type: "button", class: "btn", onclick: go(openNewProject) }, "＋ Neues Projekt"),
      inProject && !currentProject()?.code ? h("button", { type: "button", class: "btn", onclick: go(openSetCode) }, "Kürzel für dieses Projekt festlegen") : null,
      inProject ? h("button", { type: "button", class: "btn", onclick: go(async () => copy(await api(P(state.project) + "/status.md"), "STATUS.md-Abschnitt kopiert")) }, "„Offene Punkte“ für STATUS.md kopieren") : null,
      inProject ? h("button", { type: "button", class: "btn", onclick: go(copyFooter) }, "Fußzeile kopieren") : null,
      h("button", { type: "button", class: "btn", onclick: go(openSettings) }, "⚙ Einstellungen"),
      h("a", { class: "btn", style: "display:flex;align-items:center;text-decoration:none", href: "https://github.com/IlianP/cotrack#api", target: "_blank", rel: "noopener" }, "API-Dokumentation ↗"),
      h("button", { type: "button", class: "btn danger", onclick: go(() => { store.set("cotrack.token", null); location.reload(); }) }, "Abmelden")),
    h("p", { class: "small" }, `Angemeldet als: ${ownerLabel(state.actor)}`),
    h("div", { class: "actions" }, h("button", { class: "btn" }, "Schließen")),
  );
}

const currentProject = () => state.projects.find((p) => p.slug === state.project);

// Instance settings: shape the footer the server returns to every AI (MCP and API). When it appears is up to the prompt.
async function openSettings() {
  let data;
  try { data = await api("/settings"); } catch (err) { return toast("Fehler: " + err.message); }
  const { settings: s, defaults: d, available } = data;
  const canEdit = available && state.actor === "user";
  const layout = h("select", { disabled: !canEdit },
    h("option", { value: "multi", selected: s.footer_layout === "multi" }, "Mehrzeilig – je Gruppe eine Zeile"),
    h("option", { value: "single", selected: s.footer_layout === "single" }, "Einzeilig – alles in einer Zeile"));
  // An empty field means the built-in default (shown as placeholder).
  const labelInput = (value, def) => h("input", { value: value === def ? "" : value, placeholder: `${def}  (Standard)`, maxlength: "16", disabled: !canEdit });
  const user = labelInput(s.footer_label_user, d.footer_label_user);
  const ai = labelInput(s.footer_label_ai, d.footer_label_ai);
  const preview = h("pre", { class: "preview", "aria-live": "polite" });
  const marker = (input, def) => input.value.trim().replace(/:+$/, "") || def;
  const showPreview = () => {
    const groups = [
      `${marker(user, d.footer_label_user)}: D1 Lizenz wählen · A2 Prompt einspielen`,
      `${marker(ai, d.footer_label_ai)}: A3 README überarbeiten`,
      "💡 I4 Teilpunkte",
      "⚠ W1 Auth",
    ];
    preview.textContent = groups.join(layout.value === "single" ? " · " : "\n");
  };
  for (const el of [layout, user, ai]) el.addEventListener("input", showPreview);
  showPreview();
  const save = async (body, msg) => {
    try {
      await api("/settings", { method: "PATCH", body });
      closeDialog(); toast(msg); renderFooter();
    } catch (err) { toast("Fehler: " + err.message); }
  };
  const dlg = openDialog(
    h("h3", null, "Einstellungen"),
    h("h4", null, "Fußzeile für den Chat"),
    h("p", { class: "small" }, "Gilt für die Fußzeile, die deine KI über cotrack holt (MCP und API), und für „Fußzeile kopieren“. Die Leiste unten zeigt sie immer einzeilig. Wann die Fußzeile im Chat erscheint, regelt dein Prompt."),
    field("Standard-Layout", layout),
    h("div", { class: "row2" }, field("Kennzeichen für deine Punkte", user), field("Kennzeichen für Punkte der KI", ai)),
    h("p", { class: "small" }, "Vorschau:"),
    preview,
    h("p", { class: "small" }, "Bittest du die KI im Gespräch ausdrücklich um ein anderes Format, geht das vor. Leeres Feld = Standard."),
    !available ? h("p", { class: "small", style: "color:var(--danger)" }, "Noch nicht verfügbar: Die Datenbank braucht Migration 0006 (npm run db:migrate). Bis dahin gelten die Standards.") : null,
    available && state.actor !== "user" ? h("p", { class: "small", style: "color:var(--danger)" }, "Nur mit deinem eigenen Token änderbar, nicht mit dem KI-Token.") : null,
    h("div", { class: "actions" },
      canEdit ? h("button", { type: "button", class: "btn", onclick: () => save({ footer_layout: null, footer_label_user: null, footer_label_ai: null }, "Standard wiederhergestellt") }, "Standard") : null,
      h("span", { class: "spacer" }),
      h("button", { type: "button", class: "btn", onclick: closeDialog }, "Schließen"),
      canEdit ? h("button", { class: "primary" }, "Speichern") : null),
  );
  dlg.querySelector("form").addEventListener("submit", (e) => {
    e.preventDefault();
    if (!canEdit) return closeDialog();
    save({ footer_layout: layout.value, footer_label_user: user.value.trim() || null, footer_label_ai: ai.value.trim() || null }, "Einstellungen gespeichert");
  });
}

function openSetCode() {
  const p = currentProject();
  const code = h("input", { required: true, pattern: "[A-Za-z]{2}[A-Za-z0-9]{0,2}", maxlength: "4", placeholder: "2–4 Zeichen, z. B. CT", style: "text-transform:uppercase" });
  const d = openDialog(
    h("h3", null, `Kürzel für ${p.name}`),
    h("p", { class: "small" }, "Zwei Buchstaben, dann optional Buchstaben oder Ziffern. Einmal festgelegt, lässt es sich nicht mehr ändern."),
    field("Kürzel", code),
    h("div", { class: "actions" }, h("button", { type: "button", class: "btn", onclick: closeDialog }, "Abbrechen"), h("button", { class: "primary" }, "Festlegen")),
  );
  d.querySelector("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    try {
      await api(P(p.slug), { method: "PATCH", body: { code: code.value.trim() } });
      closeDialog(); await loadProjects(); toast("Kürzel festgelegt");
    } catch (err) { toast("Fehler: " + err.message); }
  });
}

function openNewProject() {
  const slug = h("input", { required: true, pattern: "[a-z0-9][a-z0-9\\-]{0,62}", placeholder: "z. B. festival-workshop-planner" });
  const name = h("input", { placeholder: "Anzeigename" });
  const repo = h("input", { placeholder: "GitHub: owner/repo (optional)" });
  const code = h("input", { pattern: "[A-Za-z]{2}[A-Za-z0-9]{0,2}", maxlength: "4", placeholder: "2–4 Zeichen, leer = Vorschlag", style: "text-transform:uppercase" });
  let timer;
  const suggest = () => {
    clearTimeout(timer);
    timer = setTimeout(async () => {
      const s = slug.value.trim();
      if (!/^[a-z0-9][a-z0-9-]*$/.test(s)) return;
      try { const r = await api("/code-suggestion?slug=" + encodeURIComponent(s)); code.placeholder = r.code ? `${r.code} (Vorschlag)` : "2–4 Zeichen"; } catch { /* suggestion is optional */ }
    }, 250);
  };
  repo.addEventListener("input", () => {
    const r = repo.value.trim().split("/")[1];
    if (r && !slug.dataset.touched) { slug.value = r.toLowerCase().replace(/[^a-z0-9-]/g, "-"); suggest(); }
  });
  slug.addEventListener("input", () => { slug.dataset.touched = "1"; suggest(); });
  const d = openDialog(
    h("h3", null, "Neues Projekt"),
    field("GitHub-Repository", repo), field("Slug (URL)", slug), h("div", { class: "row2" }, field("Name", name), field("Kürzel", code)),
    h("p", { class: "small" }, "Das Kürzel (z. B. CT) steht vor Kennungen, wenn mehrere Projekte im Gespräch sind: CT:A14. Es lässt sich später nicht mehr ändern."),
    h("div", { class: "actions" }, h("button", { type: "button", class: "btn", onclick: closeDialog }, "Abbrechen"), h("button", { class: "primary" }, "Anlegen")),
  );
  d.querySelector("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    try {
      const { project } = await api("/projects", { method: "POST", body: { slug: slug.value.trim(), name: name.value.trim() || undefined, repo: repo.value.trim() || undefined, code: code.value.trim() || undefined } });
      closeDialog(); await loadProjects(); selectProject(project.slug); toast("Projekt angelegt");
    } catch (err) { toast("Fehler: " + err.message); }
  });
}

function showLogin(msg) {
  const input = h("input", { type: "password", required: true, autocomplete: "current-password", placeholder: "Token" });
  const d = openDialog(
    h("h3", null, "co", h("b", { style: "color:var(--accent)" }, "track"), " – Anmelden"),
    msg ? h("p", { class: "small", style: "color:var(--danger)" }, msg) : null,
    h("p", { class: "small" }, "Gib deinen Zugangstoken ein. Er wird nur in diesem Browser gespeichert."),
    field("Token", input),
    h("div", { class: "actions" }, h("button", { class: "primary" }, "Anmelden")),
  );
  d.addEventListener("cancel", (e) => e.preventDefault(), { once: true });
  d.querySelector("form").addEventListener("submit", (e) => {
    e.preventDefault(); state.token = input.value.trim(); store.set("cotrack.token", state.token); closeDialog(); boot();
  });
}

boot();
</script>
</body>
</html>
