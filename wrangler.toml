name = "cotrack"
main = "src/worker.js"
compatibility_date = "2025-10-01"

# The UI is a single HTML file imported as text by the worker.
rules = [{ type = "Text", globs = ["**/*.html"], fallthrough = false }]

[[d1_databases]]
binding = "DB"
database_name = "cotrack-db"
database_id = "412df387-a458-4f9f-979a-ea66b9a0a2e0"   # replace with your own when self-hosting
migrations_dir = "migrations"

# Secrets (set with `npx wrangler secret put <NAME>`):
#   TOKEN_USER – token for the human (web UI, manual API use)
#   TOKEN_AI   – token for AI assistants (Claude, ChatGPT, …)
